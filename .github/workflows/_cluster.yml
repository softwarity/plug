name: _cluster

# ONE e2e "cluster", whichever family. compose-for.yml, k8s-for.yml and
# swarm-for.yml are the three facades ci.yml dispatches by file name (and
# whose run-name it then looks for): each calls this with its family, its
# serve script and its TTL, and nothing else differs. The cluster lives on its
# own run so it lives separately from the tests: started (and later cancelled)
# by ci.yml via `gh workflow run` / `gh run cancel`, it brings up the agent and
# the services, joins the Tailscale tailnet as plug-<family>-<corr>, and idles
# until cancelled, so a macOS/Windows runner on the same tailnet can reach it
# BY NAME through plug.
#
# Requires repo secrets TAILSCALE_CLIENT_ID / TAILSCALE_CLIENT_SECRET (a
# Tailscale OAuth client tagged tag:ci), passed by the facade.
on:
  workflow_call:
    inputs:
      family:
        description: compose, k8s or swarm; names the tailnet node and the artifact
        type: string
        required: true
      serve_script:
        description: the script that stands the cluster up and idles (scripts/ci/*-serve.sh)
        type: string
        required: true
      ttl:
        description: >-
          The TTL backstop, in seconds. kill-<family> in ci.yml cancels the run
          long before; this is what ends it when nothing else does. The legs
          have 25 or 30 minutes and e2e-arm64 starts late on the compose
          clusters, so one value fits all three families.
        type: string
        required: false
        default: "2100"
      corr:
        description: the correlation id (the caller's run id, attempt and suffix)
        type: string
        required: true
      caller:
        description: the run id of the CI run this cluster serves (empty on a manual dispatch)
        type: string
        required: false
        default: ""
      image:
        description: the agent image to pull (empty builds from this checkout)
        type: string
        required: false
        default: ""
    secrets:
      TAILSCALE_CLIENT_ID:
        required: true
      TAILSCALE_CLIENT_SECRET:
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_RW:
        required: false

permissions:
  contents: read
  actions: read # the serve idles by WATCHING the caller run: dead caller, dead cluster

jobs:
  # The agent image, built here ONLY when nobody handed us one: a manual
  # dispatch. In CI the caller has already published it for this commit, so
  # this job is skipped and `serve` pulls it straight from the registry.
  #
  # It used to run in every case and then ship the image to `serve` as an
  # artifact: docker save, gzip, upload, download, load, about two minutes to
  # move bytes both runners could already fetch from a registry. That sat on
  # the critical path of EVERY leg, since no leg starts before its cluster
  # answers: 268s of one Windows leg's 28 minutes was this wait.
  build-agent:
    name: build the agent image (manual dispatch only)
    if: inputs.image == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build it from this checkout
        run: docker build -f agent/Dockerfile -t softwarity/plug:e2e .
      - name: Save it for the serve job
        run: docker save softwarity/plug:e2e | gzip > /tmp/agent-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: agent-image-${{ inputs.family }}
          path: /tmp/agent-image.tar.gz
          retention-days: 1

  serve:
    name: serve the cluster (${{ inputs.family }})
    needs: build-agent
    # `skipped` is the NORMAL outcome for build-agent: it only runs on a manual
    # dispatch with no image. Without always() a skipped dependency would skip
    # this job too, and no cluster would ever come up.
    if: always() && (needs.build-agent.result == 'success' || needs.build-agent.result == 'skipped')
    runs-on: ubuntu-latest
    # A job with no timeout gets GitHub's default of six hours. The TTL backstop
    # inside this job only arms once the serve step runs, so anything that hangs
    # BEFORE it (a wedged docker pull, measured at over an hour) holds a runner
    # with nothing watching. The e2e legs give up on a missing cluster after ten
    # minutes; forty is already far past the point of being useful to anyone.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      # PULL what ci.yml published for this commit rather than building again.
      # Same Dockerfile and same commit is NOT the same artefact: `apk` and the
      # wintun download reach the network on every build, which is exactly how
      # 2.7.3 died, so a cluster that builds its own image cannot vouch for the
      # one we ship.
      #
      # WAIT for it rather than require it: the caller dispatches us before the
      # build finishes, on purpose. The reference is predictable, so booting
      # this runner and checking out happen while it is still being built.
      - name: Pull the tested image
        if: inputs.image != ''
        # Through `env`, never interpolated into the script: this job holds the
        # tailnet credentials and the Docker Hub write token, and a dispatch
        # input written straight into `run:` is a shell injection for whoever
        # can dispatch. The value is also checked against the one shape ci.yml
        # ever sends (docker.io/softwarity/plug:<tag>) before it reaches docker.
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in
            docker.io/softwarity/plug:[A-Za-z0-9]*) ;;
            *) echo "::error::refusing image '$IMAGE': not a docker.io/softwarity/plug:<tag> reference"; exit 1 ;;
          esac
          if ! printf '%s' "${IMAGE#docker.io/softwarity/plug:}" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::refusing image '$IMAGE': the tag is not a docker tag"; exit 1
          fi
          echo "waiting for $IMAGE (built in parallel by the caller)"
          # Bounded by the CLOCK, not by a number of attempts. The loop used to
          # count tries, which silently assumes `docker pull` always returns.
          # It does not: one runner's pull hung past forty minutes while its
          # twin, on another runner, pulled the same digest in seconds. No retry
          # ever fired, no error was ever printed, the cluster never came up,
          # and the legs blamed "cluster never became reachable", pointing at
          # the wrong thing entirely. So: a timeout per attempt, and a deadline
          # on the whole wait.
          ok=""
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if timeout 120 docker pull -q "$IMAGE"; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$IMAGE never pulled inside 15 minutes: did the image build fail, or is the registry throttling?"; exit 1; }
          docker tag "$IMAGE" softwarity/plug:e2e
      - uses: actions/download-artifact@v7
        if: inputs.image == ''
        with:
          name: agent-image-${{ inputs.family }}
          path: /tmp
      - name: Load the image built here
        if: inputs.image == ''
        run: gunzip -c /tmp/agent-image.tar.gz | docker load
      - name: Say what it serves
        # --entrypoint: the image's entrypoint ignores its args and runs the agent
        # in the foreground; without the override this docker run never returns.
        run: |
          echo "agent image ready, serves plug version: $(docker run --rm --entrypoint cat softwarity/plug:e2e /opt/plug/VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The node's name is the contract the legs read: ci.yml hands each leg
      # plug-<family>-<corr> as A and B, scripts/ci/e2e/lib.sh reads the family
      # off it, and the multicluster cell strips the prefix to get the corr id
      # the `ident` service answers.
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-${{ inputs.family }}-${{ inputs.corr }}
      # Authenticated, because anonymous Docker Hub pulls from a GitHub runner
      # share one heavily rate-limited quota with every other project on that IP.
      # A compose cluster died on `rabbitmq Error unauthorized: authentication
      # required` while pulling a service image, and the four legs waiting on that
      # cluster then spent thirty minutes reaching their own timeout to report
      # that the cluster never came up: a message pointing at this repository for
      # something that happened at the registry. The credentials already exist and
      # were simply not being used here.
      #
      # Skipped when the secret is absent, which is a fork: the pull is then
      # anonymous exactly as before, and no worse.
      - name: Sign in to Docker Hub for the service images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_RW: ${{ secrets.DOCKERHUB_RW }}
        run: |
          # Guarded here and not in an `if:`, because a step condition cannot see
          # that step's own env block.
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "no Docker Hub credentials on this runner: service image pulls stay anonymous"
            exit 0
          fi
          printf '%s' "$DOCKERHUB_RW" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Serve the cluster (idle until cancelled)
        env:
          # idle-until-caller-done.sh watches the CALLER run with gh; without a
          # token it cannot, and the cluster idles out its whole TTL instead of
          # freeing the runner as soon as the caller is done or cancelled.
          GH_TOKEN: ${{ github.token }}
          PLUG_CALLER_RUN_ID: ${{ inputs.caller }} # authoritative; the corr split is the fallback
          PLUG_CLUSTER_TTL: ${{ inputs.ttl }}
          # The cluster's identity, served by the `ident` service: the
          # multicluster e2e asserts that the SAME name reaches the RIGHT
          # cluster through each plug.
          PLUG_CLUSTER_IDENT: ${{ inputs.corr }}
          SERVE: ${{ inputs.serve_script }}
        run: bash "$SERVE"
