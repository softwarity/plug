name: _e2e

# ONE e2e leg, written once. The e2e that native-Linux Docker cannot give us:
# run plug NATIVELY on each OS against a REAL cluster, reaching services BY
# NAME over a Tailscale mesh (the cluster cannot be Linux containers on a
# mac/win runner, so it runs ONCE on its own Linux run and every client joins
# it). ci.yml calls this four times: once per cluster family (compose, k8s,
# swarm) over the three OSes, and once for the arm64 client on the compose
# clusters. The cells are the steps below, in this order, under these names,
# on every leg: that is what makes the legs of three families read as ONE
# comparison instead of three stories, and it is guaranteed by construction
# now that the list exists in one place. scripts/ci/check-e2e-cells.sh keeps
# the order and the files under scripts/ci/e2e/ in step.
#
# The names say what is ASSERTED, never how the backend does it: "park the
# deployed service" is one test, whether the script stops a container, scales
# a service to 0 or repoints a Service.
#
# A failing cell STOPS its leg: the cells after it are skipped (grey, not
# green), the leg concludes red within seconds and abort-on-fail cancels the
# whole run, the nine other legs included. What a red run shows is the failing
# leg's red cell and whatever the others had reached by then. The cells most
# likely to trip on a timing (takeover, orphan) come right after the env
# cells, before the protocol matrix, so a flake costs minutes rather than a run.
#
# The cluster-B cells (resilience, the update cells, admission) run BESIDE the
# chain, started after setup and the two NXDOMAIN cells (e2e-background.sh,
# the step says why): each touches only what cluster B keeps for this leg,
# and together they were a third of a leg spent
# waiting on agents to restart. Their steps keep their place in the list and
# show each one's output and verdict when the chain reaches them; a red one
# stops the chain at its next cell all the same. The compat step closes the
# set, after them, since it runs another launcher on this machine: the last
# published launcher must still drive THIS branch's core.

on:
  workflow_call:
    inputs:
      family:
        description: compose, k8s or swarm (which cluster family A and B are)
        type: string
        required: true
      label:
        description: what the leg's display name says after the OS
        type: string
        required: true
      legs:
        description: the runner labels, as a JSON list
        type: string
        required: true
      cluster_a:
        description: cluster A's tailnet name
        type: string
        required: true
      cluster_b:
        description: cluster B's tailnet name
        type: string
        required: true
      minutes:
        description: >-
          The leg's timeout, and what the cell watchdog budgets from
          (PLUG_JOB_MINUTES). One value for both, so a late cell can never get
          an alarm that rings after the job is already dead.
        type: number
        required: true
      short_sha:
        description: the short sha the cluster image is tagged with
        type: string
        required: true
      full:
        description: >-
          false runs the subset the arm64 client can: the cells bound to
          services the CLUSTER declares per leg (flaky-<leg>, tko-<leg>,
          res-*, prev-agent-<leg>, adm-agent-<leg>) exist for linux/mac/win only, and the
          container cells need the amd64 sidecar image.
        type: boolean
        required: false
        default: true
    secrets:
      TAILSCALE_CLIENT_ID:
        required: true
      TAILSCALE_CLIENT_SECRET:
        required: true

jobs:
  leg:
    name: ${{ matrix.os }} (${{ inputs.label }})
    runs-on: ${{ matrix.os }}
    # Read-only, and the checkout does not keep the token either. A leg runs
    # pip, third-party images and a plug binary installed from the cluster,
    # with nothing to write back: it is abort-on-fail that cancels the run when
    # a leg fails, and no `gh` runs on a leg.
    permissions:
      contents: read
      packages: read # the image under test is on GHCR, which the Linux legs run
    timeout-minutes: ${{ inputs.minutes }} # a hung cell must not run the job (and the cluster) for hours
    env:
      PLUG_JOB_MINUTES: ${{ inputs.minutes }}
      A: ${{ inputs.cluster_a }}
      B: ${{ inputs.cluster_b }}
      AGENT_IMAGE: ghcr.io/softwarity/plug:sha-${{ inputs.short_sha }}-amd64
      # Where the shared client bundle lands (relative to the workspace, so Git
      # Bash on Windows reads it the same way every other shell does).
      PREBUILT_CLIENTS: e2e-clients
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        os: ${{ fromJSON(inputs.legs) }}
    steps:
      # FIRST, before the checkout: the cell watchdog in e2e-matrix.sh budgets
      # a late cell from what is left of the job, and "the job" starts here,
      # not at the end of a setup that waits up to ten minutes for a cluster.
      - name: Start the job clock (the cell watchdog budgets from it)
        shell: bash
        run: echo "PLUG_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # nothing after this step talks to git; see `permissions`
      # The image under test is on GHCR; the Linux legs run it (dockerrun,
      # keymount). The token is this run's, read-only.
      - name: Log in to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/e2e-leg
        with:
          family: ${{ inputs.family }}
          tailscale-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          tailscale-client-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          launchers: ${{ inputs.full }}
      # ── THE CELLS ────────────────────────────────────────────────────────
      # One cell per step so each shows its own green/red in the run view. The
      # setup step installs plug FROM the cluster + takes delivery of the
      # clients and records the shared state ($RUNNER_TEMP) the cells read
      # back. A cell the arm64 subset does not run carries `inputs.full`; it is
      # skipped there, grey, in its place in the list.
      - name: "Setup: install plug from the cluster + build clients"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh setup "$A" "$B" 2222
      - name: "DNS honesty: an absent name answers NXDOMAIN"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh dnshonesty "$A" "$B" 2222
      - name: "Expose: serve a local port to the cluster (-s)"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh expose "$A" "$B" 2222
      # The cluster-B cells (bg_cells in scripts/ci/e2e/lib.sh, which says why
      # they can) start here and run beside the chain; each keeps its step
      # below, which shows its output and its verdict. Not on the arm64 subset,
      # which runs none of them.
      #
      # AFTER the two cells that assert a name does NOT resolve. On macOS and
      # Windows one daemon answers every lookup and asks every connected
      # cluster, and a cluster whose tunnel is hiccuping answers "found", on
      # purpose: a reconnect must never break resolution. The cells beside the
      # chain restart and roll cluster B's agents, so while they run an absent
      # name resolves on those machines, which is right for a user and wrong
      # for a cell that waits for NXDOMAIN.
      - name: "Start the cluster-B cells beside the chain (each shows below, in its own step)"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-background.sh "$A" "$B" 2222
      - name: Env passthrough
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh env "$A" "$B" 2222
      - name: "Workload env: projected into a takeover, the cluster wins, --no-env, --no-env=KEY, -c --env-of"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh workloadenv "$A" "$B" 2222
      - name: "Privilege drop: the child runs as the caller, with no capabilities"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh privdrop "$A" "$B" 2222
      - name: "DNS relay: a non-A question reaches the upstream"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh dnsrelay "$A" "$B" 2222
      - name: "Client-only (-c): consume the cluster, nothing served"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh clientonly "$A" "$B" 2222
      - name: "Doctor: the health checks pass on a healthy leg"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh doctor "$A" "$B" 2222
      - name: "Takeover: park the deployed service, serve ours, restore it"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh takeover "$A" "$B" 2222
      - name: Orphaned takeover, session killed with no unserve (the workload comes back without an agent restart)
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh orphan "$A" "$B" 2222
      - name: "Live mount: the workload's volumes, automatic and explicit, read and written"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh mount "$A" "$B" 2222
      - name: Protocol matrix (4 langs × 8 protocols)
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh matrix "$A" "$B" 2222
      - name: Multicluster (simultaneous)
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multicluster "$A" "$B" 2222
      # No --dockerrun cells on the arm64 leg, and the reason is the image
      # rather than the feature. AGENT_IMAGE is the CLUSTER's image, tagged
      # -amd64; the multi-arch tag does not exist yet at this point of the
      # pipeline (the promotion job that merges the manifest runs after these
      # legs). The three families cover the cells on their ubuntu legs.
      - name: Container member, an unmodified image in the cluster (--dockerrun)
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh dockerrun "$A" "$B" 2222
      - name: Key mount, the profile's own key carried into the sidecar (--dockerrun)
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh keymount "$A" "$B" 2222
      - name: Outage recovery
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh outage "$A" "$B" 2222
      - name: "Expose, named port: plug picks it, {PORT} carries it into the command"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh exposevar "$A" "$B" 2222
      - name: Gateway callback (external → published gateway → sink)
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh gateway "$A" "$B" 2222
      - name: "Collision: a name already taken is refused"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh collision "$A" "$B" 2222
      - name: "Name lease: a swept signpost must not free a live name"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh lease "$A" "$B" 2222
      - name: "Same cluster port: two names, both reachable"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh sameport "$A" "$B" 2222
      - name: "Multi-port: one name, three cluster ports"
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multiport "$A" "$B" 2222
      - name: "Resilience: agent restarted mid-session (self-heal, boot-gc, re-park)"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh resilience "$A" "$B" 2222
      - name: "Admission by approval: first member, request, accept, restart, revoke"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh admission "$A" "$B" 2222
      - name: "Update: plug update verb + launcher path (per-leg agent)"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh update "$A" "$B" 2222
      - name: "Update: <tag> refuses an unpublished tag, and an agent too old"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatetag "$A" "$B" 2222
      - name: "Update: the background check finds it, the next launch says it"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatenotify "$A" "$B" 2222
      - name: "Launcher compat: latest published launcher, this branch's core"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/compat-launcher.sh "$A" 2222
      # Last, in the foreground: against a release agent, `plug update` moves
      # this machine's launcher to that release, and nothing may run after it.
      - name: "Update: a release agent retargets to the newest release"
        if: success() && inputs.full
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatejump "$A" "$B" 2222
