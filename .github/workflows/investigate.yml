name: Investigate (macOS, cells beside the chain)

# A narrow pipeline for one investigation: why the takeover cell fails on a Mac
# while the cluster-B cells run beside the chain (scripts/ci/e2e-background.sh).
# The image, the clients, two compose clusters and ONE macOS leg, which runs the
# setup cell and then scripts/ci/investigate-bg.sh. Every push to main runs it
# while ci.yml's push trigger is off; both go back to normal once it is found.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rounds:
        description: how many takeover rounds beside the cluster-B cells
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: investigate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: Build the standalone image (immutable tag only)
    permissions:
      contents: read
      packages: write # the test image goes to GHCR
    uses: ./.github/workflows/_docker.yml
    with:
      immutable_only: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_RW: ${{ secrets.DOCKERHUB_RW }}
      PLUG_RELEASE_KEY: ${{ secrets.PLUG_RELEASE_KEY }}

  build-clients:
    name: Build the e2e clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: e2e/clients/go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build them
        run: bash scripts/ci/build-clients.sh e2e-clients
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-clients
          path: e2e-clients/*
          if-no-files-found: error
          retention-days: 1

  start-cluster:
    name: start the two compose clusters
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch the cluster runs
      contents: read
    outputs:
      short_sha: ${{ steps.ref.outputs.short }}
      a: ${{ steps.dispatch.outputs.a }}
      b: ${{ steps.dispatch.outputs.b }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: ref
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: ghcr.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}-amd64
          CORR: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          d="$RUNNER_TEMP/dispatch"; mkdir -p "$d"
          for c in a b; do
            bash scripts/ci/dispatch-cluster.sh "$CORR-$c" compose-for.yml > "$d/$c" &
          done
          failed=0
          for p in $(jobs -p); do wait "$p" || failed=1; done
          for c in a b; do echo "$c=$(cat "$d/$c")" >> "$GITHUB_OUTPUT"; done
          [ "$failed" = 0 ] || { echo "::error::a cluster run could not be dispatched"; exit 1; }

  mac:
    name: macOS, takeover beside the cluster-B cells
    needs: [start-cluster, build-clients]
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PLUG_JOB_MINUTES: 40
      A: plug-compose-${{ github.run_id }}-${{ github.run_attempt }}-a
      B: plug-compose-${{ github.run_id }}-${{ github.run_attempt }}-b
      AGENT_IMAGE: ghcr.io/softwarity/plug:sha-${{ needs.start-cluster.outputs.short_sha }}-amd64
      PLUG_DNS_TRACE: "1"
      PREBUILT_CLIENTS: e2e-clients
    steps:
      - name: Start the job clock (the cell watchdog budgets from it)
        run: echo "PLUG_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-leg
        with:
          family: compose
          tailscale-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          tailscale-client-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          launchers: "false"
      - name: "Setup: install plug from the cluster + build clients"
        run: bash scripts/ci/e2e-matrix.sh setup "$A" "$B" 2222
      - name: Takeover rounds beside the cluster-B cells
        env:
          ROUNDS: ${{ inputs.rounds || '6' }}
        run: bash scripts/ci/investigate-bg.sh "$A" "$B" "$ROUNDS"
      - name: Keep the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: investigate-mac
          path: ${{ runner.temp }}/investigate
          retention-days: 7

  kill-clusters:
    name: kill the clusters
    needs: [start-cluster, mac]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write # cancel the cluster runs
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          A: ${{ needs.start-cluster.outputs.a }}
          B: ${{ needs.start-cluster.outputs.b }}
        run: bash scripts/ci/kill-clusters.sh "$A:compose-a" "$B:compose-b"

  ghcr-cleanup:
    name: delete this run's test images from GHCR
    needs: [image-build, kill-clusters]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v7
        continue-on-error: true # a run cancelled before its builds has none
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/ghcr-cleanup.sh "${GITHUB_SHA::7}" "$RUNNER_TEMP/digests"
