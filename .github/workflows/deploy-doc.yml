name: Deploy Doc to GitHub Pages
run-name: ${{ github.actor }} deploy doc on ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-doc.yml'
  # A release changes no docs/** file, so redeploy on it too — that regenerates
  # assets/version.json (the pinned image tag shown in the deploy snippets) from
  # the new tag.
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need the tags so gen-version.mjs can resolve the latest release

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install doc-site deps
        working-directory: docs
        run: npm ci

      - name: Build doc-site for GitHub Pages
        working-directory: docs
        run: npm run build -- --base-href /plug/

      # The social media kit (mp4 / gif / hero png) is DERIVED from the animated
      # SVG — rendered here and served by Pages under /plug/media/, never
      # committed (binaries would bloat the git history on every re-render).
      # The runner ships ffmpeg; Playwright seeks the SMIL loop frame by frame.
      - name: Render the diagram media
        working-directory: docs
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/render-diagram.mjs
          mkdir -p dist/doc-site/browser/media
          ffmpeg -y -framerate 15 -i .frames/f%03d.png -c:v libx264 -pix_fmt yuv420p -crf 20 \
            -movflags +faststart dist/doc-site/browser/media/about-diagram.mp4
          ffmpeg -y -framerate 15 -i .frames/f%03d.png \
            -vf "fps=12,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
            dist/doc-site/browser/media/about-diagram.gif
          cp .frames/f180.png dist/doc-site/browser/media/about-diagram-hero.png
          # The Open Graph card (og:image): 1200x630, the 1.91:1 ratio link
          # previews expect — a centred crop of the round-2 hero frame.
          ffmpeg -y -i .frames/f180.png -vf "crop=1800:945:0:38,scale=1200:630" \
            dist/doc-site/browser/media/about-diagram-og.png

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/dist/doc-site/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
