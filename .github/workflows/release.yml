name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persist the PAT so release-flow's push carries it — a push made with the
          # default GITHUB_TOKEN triggers no workflow, and the CI run of this very
          # commit is what builds, tests and publishes the release image.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Release
        # Pinned to a commit, not a tag, because this step runs with the PAT in
        # scope: the checkout above persists it on purpose (a push made with the
        # default token triggers no workflow, and the CI of the release commit is
        # what builds and publishes the image). A moving tag means whoever can
        # move it can read that PAT. v1 at the time of pinning.
        uses: softwarity/release-flow@58d6aa0216d97976a623edca2fe484eababf5b57
        with:
          bump: ${{ inputs.bump }}
          # language auto-detected: no manifest → tag (version lives in the git tags)
