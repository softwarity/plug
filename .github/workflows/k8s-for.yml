name: k8s-for

# The e2e "cluster", KUBERNETES FLAVOR — the k8s twin of compose-for.yml, so the
# OS legs replay the exact same e2e chain against a real Kubernetes backend
# (kind: upstream k8s in Docker). Started (and later cancelled) by ci.yml via
# `gh workflow run` / `gh run cancel`. It builds the agent from this branch,
# stands up kind + the services (e2e/k8s.cluster.yaml) + the agent from the
# PUBLISHED deploy/plug-k8s.yaml (RBAC included), joins the Tailscale tailnet,
# and idles until cancelled.
#
# Requires repo secrets TAILSCALE_CLIENT_ID / TAILSCALE_CLIENT_SECRET (a Tailscale
# OAuth client tagged tag:ci). Dispatch-only by design.
on:
  workflow_dispatch:
    inputs:
      corr:
        description: correlation id (the caller's run id) — names the tailnet node
        required: true
      image:
        description: >-
          The agent image to run — the reference ci.yml just published for this
          commit. Pulled, not rebuilt: the whole point is that the legs exercise
          the artefact we ship. Empty falls back to building from this checkout,
          so a manual dispatch still works on its own.
        required: false
        default: ""

run-name: k8s-for-${{ inputs.corr }}

permissions:
  contents: read
  actions: read # the serve idles by WATCHING the caller run — dead caller, dead cluster

jobs:
  # THE image under test, built from this branch — same two-job shape as
  # compose-for.yml (the image travels between runners as an artifact).
  build-agent:
    name: get the agent image (published, or built here)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # PULL what ci.yml published for this commit rather than building again.
      # Same Dockerfile and same commit is NOT the same artefact — `apk` and the
      # wintun download reach the network on every build, which is exactly how
      # 2.7.3 died — so a leg that builds its own image cannot vouch for the one
      # we ship. Falls back to building when dispatched by hand with no image.
      - name: Get the agent image
        run: |
          if [ -n "${{ inputs.image }}" ]; then
            echo "pulling ${{ inputs.image }} (the build this commit published)"
            docker pull -q "${{ inputs.image }}"
            docker tag "${{ inputs.image }}" softwarity/plug:e2e
          else
            echo "no image given (manual dispatch) — building from this checkout"
            docker build -f agent/Dockerfile -t softwarity/plug:e2e .
          fi
          # --entrypoint: the image's entrypoint ignores its args and execs sshd in
          # the foreground — without the override this docker run never returns.
          echo "agent image ready — serves plug version: $(docker run --rm --entrypoint cat softwarity/plug:e2e /opt/plug/VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the image for the serve job
        run: docker save softwarity/plug:e2e | gzip > /tmp/agent-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: agent-image-k8s
          path: /tmp/agent-image.tar.gz
          retention-days: 1

  serve:
    name: serve the cluster (kind)
    needs: build-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: agent-image-k8s
          path: /tmp
      - name: Load the agent image
        run: gunzip -c /tmp/agent-image.tar.gz | docker load
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-k8s-${{ inputs.corr }}
      - name: Serve the cluster (idle until cancelled)
        env:
          # idle-until-caller-done.sh watches the CALLER run with gh; without a
          # token it cannot, and the cluster idles out its whole TTL instead of
          # freeing the runner as soon as the caller is done or cancelled.
          GH_TOKEN: ${{ github.token }}
          # Backstop only — kill-cluster cancels this run when the e2e jobs
          # finish. Longer than compose's: the TTL starts after the kind
          # rollout, which lands ~2-3 min later, and the legs still need their
          # full chain after that.
          PLUG_CLUSTER_TTL: "2100"
          PLUG_CLUSTER_IDENT: ${{ inputs.corr }}
        run: bash scripts/ci/k8s-serve.sh
