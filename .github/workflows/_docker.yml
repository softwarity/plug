name: Reusable Docker build & publish

# Reusable multi-arch build. Each architecture is built on its NATIVE runner
# (no QEMU emulation) in parallel, pushed by digest; a final job assembles the
# manifest list. Tags are derived from the caller's ref by metadata-action, so
# the same logic serves branch pushes (CI) and version tags (release).
on:
  workflow_call:

env:
  IMAGE: docker.io/softwarity/plug

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          # The tags, because the version is resolved from the one pointing at
          # THIS commit (see "Resolve version"). fetch-tags rather than
          # fetch-depth: 0 — the tags are all we need and the history is not
          # small.
          fetch-tags: true
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Docker labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Resolve version
        id: ver
        # The version comes from the TAG THAT POINTS AT THIS COMMIT — not from
        # what triggered the run. That one change is what lets a release be a
        # promotion instead of a rebuild.
        #
        # release-flow creates the release commit ("2.9.3", the resolved notes)
        # and tags it, pushing both. The push builds this image, and because the
        # tag is on HEAD the image is stamped 2.9.3 — so docker-release only has
        # to put the semver tags on that exact digest, which is also the digest
        # `latest` points at. Before, the tag rebuilt from the same sources, and
        # same sources is not the same artefact: `apk` and the wintun download
        # reach the network again, which is precisely how 2.7.3 died on someone
        # else's bad minute.
        #
        # (The e2e legs build their own :e2e image from this Dockerfile rather
        # than consuming this one, so "released == e2e-tested" is still not true.
        # What this buys is that released == what the CI of that commit shipped,
        # one build instead of two, and no network at release time.)
        #
        # Any other commit → "dev" plus the short sha as build metadata, because
        # "dev" alone names every build of every branch: without the commit, two
        # rebuilds of `main` would look identical and the CLI would keep serving
        # the cached core. A RELEASE needs none of that — v2.4.0 designates one
        # commit, and the sha only makes the version harder to read everywhere it
        # shows (plug version, plug versions, update messages).
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$tag" ]; then
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "rev="           >> "$GITHUB_OUTPUT"
            echo "release version ${tag#v} (tag $tag points at $GITHUB_SHA)"
          else
            echo "value=dev"            >> "$GITHUB_OUTPUT"
            echo "rev=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "dev version dev+${GITHUB_SHA::7} (no v-tag on this commit)"
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
            GIT_REV=${{ steps.ver.outputs.rev }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            # The immutable handle on this exact build: `sha-<short>`. It is what
            # docker-release promotes to the semver tags, and it has to be a tag
            # nothing else ever moves — `latest` cannot serve, since another push
            # to main moves it between the CI and the release.
            type=sha
            # Only reachable if this reusable workflow is ever called on a tag
            # ref. The release path does NOT: it promotes the digest the CI
            # already built and blessed, rather than building again.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
