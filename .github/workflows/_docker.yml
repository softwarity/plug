name: Reusable Docker build & publish

# Reusable multi-arch build. Each architecture is built on its NATIVE runner
# (no QEMU emulation) in parallel, pushed by digest; a final job assembles the
# manifest list. Tags are derived from the caller's ref by metadata-action, so
# the same logic serves branch pushes (CI) and version tags (release).
on:
  workflow_call:
    inputs:
      flavour:
        description: >-
          Which client this image serves. Empty is the standalone product.
          `hosted` builds the client for a gateway that embeds the agent: it
          carries keygen/pubkey and no update. It reaches the binaries through
          the FLAVOUR build-arg, which appends it to the version string - the
          one place a flavour lives, since that string is already the cache key
          for the core a launcher fetches.
        type: string
        required: false
        default: ''
      immutable_only:
        description: >-
          Only put the immutable `sha-<short>` tag on the manifest, leaving
          `latest` and the branch name for later. That is what lets the e2e
          legs pull THIS build and be the thing that decides whether it earns
          the moving tags — a digest nobody has exercised must never be what
          `latest` points at.
        type: boolean
        required: false
        default: false
    outputs:
      image:
        description: The immutable reference this build published (softwarity/plug:sha-<short>)
        value: ${{ jobs.merge.outputs.image }}

# Declared rather than inherited. A reusable workflow takes its caller's scopes,
# so this one's were whatever ci.yml happened to have - and it pushes to Docker
# Hub with its own secrets, so it needs nothing from the GitHub token at all.
# Saying so here means a caller that grants more does not silently widen it.
permissions:
  contents: read

env:
  IMAGE: docker.io/softwarity/plug

jobs:
  build:
    name: Build the ${{ inputs.flavour || 'standalone' }} image, ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          # The tags, because the version is resolved from the one pointing at
          # THIS commit (see "Resolve version"). fetch-tags rather than
          # fetch-depth: 0 — the tags are all we need and the history is not
          # small.
          fetch-tags: true
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Docker labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Resolve version
        id: ver
        # The version comes from the TAG THAT POINTS AT THIS COMMIT — not from
        # what triggered the run. That one change is what lets a release be a
        # promotion instead of a rebuild.
        #
        # release-flow creates the release commit ("2.9.3", the resolved notes)
        # and tags it, pushing both. The push builds this image, and because the
        # tag is on HEAD the image is stamped 2.9.3 — so the publish job only has
        # to put the semver tags on that exact digest, which is also the digest
        # `latest` points at. Before, the tag rebuilt from the same sources, and
        # same sources is not the same artefact: `apk` and the wintun download
        # reach the network again, which is precisely how 2.7.3 died on someone
        # else's bad minute.
        #
        # The e2e legs PULL this image now instead of building their own, so
        # "released == e2e-tested" holds at the digest: one build, tested, then
        # renamed. No network at release time, nothing rebuilt on the way out.
        #
        # Any other commit → "dev" plus the short sha as build metadata, because
        # "dev" alone names every build of every branch: without the commit, two
        # rebuilds of `main` would look identical and the CLI would keep serving
        # the cached core. A RELEASE needs none of that — v2.4.0 designates one
        # commit, and the sha only makes the version harder to read everywhere it
        # shows (plug version, plug versions, update messages).
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$tag" ]; then
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "rev="           >> "$GITHUB_OUTPUT"
            echo "release version ${tag#v} (tag $tag points at $GITHUB_SHA)"
          else
            echo "value=dev"            >> "$GITHUB_OUTPUT"
            echo "rev=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "dev version dev+${GITHUB_SHA::7} (no v-tag on this commit)"
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
            GIT_REV=${{ steps.ver.outputs.rev }}
            FLAVOUR=${{ inputs.flavour }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped by flavour as well as platform: the two calls of this
          # workflow run in the same CI run, and a shared scope would have one
          # flavour's layers answer for the other's.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}-${{ inputs.flavour || 'std' }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}-${{ inputs.flavour || 'std' }}
      # The clusters never needed the manifest list: they all run on amd64
      # runners. Waiting for it has now cost two whole runs — the merge job is
      # last, and it competes for a runner with the sixteen jobs waiting on its
      # output. Queued ten minutes behind them once, its tag appeared after every
      # leg had already given up looking for a cluster.
      #
      # So name this digest the moment it exists. It is a registry-side
      # operation, no transfer, in a job that is here and authenticated already.
      #
      # `sha-<short>` — the multi-arch one — is untouched and remains what gets
      # promoted, so "published == tested" still holds: the amd64 digest the legs
      # exercised is the one inside that manifest.
      # Only the standalone flavour gets it: this tag exists for the e2e
      # clusters to pull, and the e2e exercises the standalone. The hosted image
      # is the same code with a different verb surface, covered by unit tests.
      - name: Name this digest for the clusters
        if: matrix.platform == 'linux/amd64' && inputs.flavour == ''
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-${GITHUB_SHA::7}-amd64" \
            "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # Same reason as the cache scope: two flavours, one run, one artefact
          # namespace. Without the suffix the merge job would assemble a manifest
          # from whichever digests landed first.
          name: digests-${{ env.PLATFORM_PAIR }}-${{ inputs.flavour || 'std' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the ${{ inputs.flavour || 'standalone' }} manifest list
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          # An explicit token in every name, never an absence: matching "the one
          # without a suffix" by glob is the kind of clever that assembles a
          # manifest from the other flavour's digests and says nothing.
          pattern: digests-*-${{ inputs.flavour || 'std' }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Every tag this build earns carries the flavour, or the two would
          # collide on sha-<short> and the second push would silently take the
          # first one's name.
          flavor: |
            suffix=${{ inputs.flavour && format('-{0}', inputs.flavour) || '' }},onlatest=true
          tags: |
            type=ref,event=branch,enable=${{ !inputs.immutable_only }}
            type=raw,value=latest,enable=${{ !inputs.immutable_only && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # The immutable handle on this exact build: `sha-<short>`. It is what
            # the publish job promotes, so it has to be a tag nothing else ever
            # moves — `latest` cannot serve, since another push to main would
            # move it under it.
            #
            # The clusters do NOT wait for this one. They pull `sha-<short>-amd64`,
            # named by the amd64 build job the moment its digest exists, because
            # this manifest is assembled last and queues behind everything that
            # depends on it. The amd64 digest is inside this manifest either way,
            # so what the legs exercised is what gets promoted.
            type=sha
            # Dead unless this reusable workflow is ever called on a tag ref,
            # which the release path does not do: the semver tags are put on the
            # tested digest by the publish job at the end of the CI.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
      # What the e2e clusters pull. A tag rather than a bare digest: the cluster
      # manifests and compose files take an image reference, and `sha-<short>`
      # names this build and only this build.
      - id: ref
        run: |
          sfx="${{ inputs.flavour && format('-{0}', inputs.flavour) || '' }}"
          echo "image=${{ env.IMAGE }}:sha-$(echo ${{ github.sha }} | cut -c1-7)$sfx" >> "$GITHUB_OUTPUT"
