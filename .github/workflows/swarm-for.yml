name: swarm-for

# The e2e "cluster", SWARM FLAVOR — the third family next to compose-for.yml
# and k8s-for.yml, so the OS legs replay the exact same e2e chain against a
# real single-node Swarm: the agent as a Swarm service on a non-attachable
# overlay, -s names provisioned as Swarm-service signposts, the takeover
# scaling to 0 and back to the original replica count. Started (and later
# cancelled) by ci.yml via `gh workflow run` / `gh run cancel`.
#
# Requires repo secrets TAILSCALE_CLIENT_ID / TAILSCALE_CLIENT_SECRET (a Tailscale
# OAuth client tagged tag:ci). Dispatch-only by design.
on:
  workflow_dispatch:
    inputs:
      corr:
        description: correlation id (the caller's run id) — names the tailnet node
        required: true
      image:
        description: >-
          The agent image to run — the reference ci.yml just published for this
          commit. Pulled, not rebuilt: the whole point is that the legs exercise
          the artefact we ship. Empty falls back to building from this checkout,
          so a manual dispatch still works on its own.
        required: false
        default: ""

run-name: swarm-for-${{ inputs.corr }}

permissions:
  contents: read
  actions: read # the serve idles by WATCHING the caller run — dead caller, dead cluster

jobs:
  # The agent image, built here ONLY when nobody handed us one — a manual
  # dispatch. In CI the caller has already published it for this commit, so this
  # job is skipped and `serve` pulls it straight from the registry.
  #
  # It used to run in every case and then ship the image to `serve` as an
  # artifact: docker save → gzip → upload → download → load, about two minutes
  # to move bytes both runners could already fetch from a registry. That sat on
  # the critical path of EVERY leg, since no leg starts before its cluster
  # answers — 268s of one Windows leg's 28 minutes was this wait.
  build-agent:
    name: build the agent image (manual dispatch only)
    if: inputs.image == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build it from this checkout
        run: docker build -f agent/Dockerfile -t softwarity/plug:e2e .
      - name: Save it for the serve job
        run: docker save softwarity/plug:e2e | gzip > /tmp/agent-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: agent-image-swarm
          path: /tmp/agent-image.tar.gz
          retention-days: 1

  serve:
    name: serve the cluster (swarm)
    needs: build-agent
    # `skipped` is the NORMAL outcome for build-agent: it only runs on a manual
    # dispatch with no image. Without always() a skipped dependency would skip
    # this job too, and no cluster would ever come up.
    if: always() && (needs.build-agent.result == 'success' || needs.build-agent.result == 'skipped')
    runs-on: ubuntu-latest
    # A job with no timeout gets GitHub's default of six hours. The TTL backstop
    # inside this job only arms once the serve step runs, so anything that hangs
    # BEFORE it — a wedged docker pull, measured at over an hour — holds a runner
    # with nothing watching. The e2e legs give up on a missing cluster after ten
    # minutes; forty is already far past the point of being useful to anyone.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      # PULL what ci.yml published for this commit rather than building again.
      # Same Dockerfile and same commit is NOT the same artefact — `apk` and the
      # wintun download reach the network on every build, which is exactly how
      # 2.7.3 died — so a cluster that builds its own image cannot vouch for the
      # one we ship.
      #
      # WAIT for it rather than require it: the caller dispatches us before the
      # build finishes, on purpose — the reference is predictable, so booting
      # this runner and checking out happen while it is still being built.
      - name: Pull the tested image
        if: inputs.image != ''
        run: |
          echo "waiting for ${{ inputs.image }} (built in parallel by the caller)"
          # Bounded by the CLOCK, not by a number of attempts. The loop used to
          # count tries — which silently assumes `docker pull` always returns.
          # It does not: one runner's pull hung past forty minutes while its
          # twin, on another runner, pulled the same digest in seconds. No retry
          # ever fired, no error was ever printed, the cluster never came up,
          # and the legs blamed "cluster never became reachable" — pointing at
          # the wrong thing entirely. So: a timeout per attempt, and a deadline
          # on the whole wait.
          ok=""
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if timeout 120 docker pull -q "${{ inputs.image }}"; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::${{ inputs.image }} never pulled inside 15 minutes — did the image build fail, or is the registry throttling?"; exit 1; }
          docker tag "${{ inputs.image }}" softwarity/plug:e2e
      - uses: actions/download-artifact@v7
        if: inputs.image == ''
        with:
          name: agent-image-swarm
          path: /tmp
      - name: Load the image built here
        if: inputs.image == ''
        run: gunzip -c /tmp/agent-image.tar.gz | docker load
      - name: Say what it serves
        # --entrypoint: the image's entrypoint ignores its args and runs the agent
        # in the foreground - without the override this docker run never returns.
        run: |
          echo "agent image ready — serves plug version: $(docker run --rm --entrypoint cat softwarity/plug:e2e /opt/plug/VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-swarm-${{ inputs.corr }}
      - name: Serve the cluster (idle until cancelled)
        env:
          # idle-until-caller-done.sh watches the CALLER run with gh; without a
          # token it cannot, and the cluster idles out its whole TTL instead of
          # freeing the runner as soon as the caller is done or cancelled.
          GH_TOKEN: ${{ github.token }}
          # Backstop only — kill-cluster cancels this run when the e2e jobs
          # finish. Same margin as k8s-for's (the legs of the three families
          # run concurrently and finish on the same horizon).
          PLUG_CLUSTER_TTL: "2100"
          PLUG_CLUSTER_IDENT: ${{ inputs.corr }}
        run: bash scripts/ci/swarm-serve.sh
