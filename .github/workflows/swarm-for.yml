name: swarm-for

# The e2e "cluster", SWARM FLAVOR: a single-node Swarm on the runner, the
# stack from e2e/swarm.cluster.yml, the agent as a Swarm service on a
# non-attachable overlay with its ssh port published through the ingress, -s
# names provisioned as Swarm-service signposts, the takeover scaling to 0 and
# back. A facade over _cluster.yml, which holds everything the three families
# share; ci.yml dispatches this file by name (scripts/ci/dispatch-cluster.sh)
# and looks for the run-name below, which is why the facade exists.
# Dispatch-only by design.
on:
  workflow_dispatch:
    inputs:
      corr:
        description: correlation id (the caller's run id); names the tailnet node
        required: true
      caller:
        description: >-
          The run id of the CI run this cluster serves, stated outright rather
          than recovered by splitting the correlation id. The split is a
          fallback: it broke silently once already when the corr id grew a field,
          and the cluster then ran out its full TTL holding a runner with nothing
          saying why. Empty on a manual dispatch, where there is no caller to
          watch.
        required: false
        default: ""
      image:
        description: >-
          The agent image to run, the reference ci.yml just published for this
          commit. Pulled, not rebuilt: the whole point is that the legs exercise
          the artefact we ship. Empty falls back to building from this checkout,
          so a manual dispatch still works on its own.
        required: false
        default: ""

run-name: swarm-for-${{ inputs.corr }}

permissions:
  contents: read
  actions: read

jobs:
  cluster:
    uses: ./.github/workflows/_cluster.yml
    with:
      family: swarm
      serve_script: scripts/ci/swarm-serve.sh
      ttl: "2100"
      corr: ${{ inputs.corr }}
      caller: ${{ inputs.caller }}
      image: ${{ inputs.image }}
    # The four _cluster.yml declares, not the vault (see ci.yml on `inherit`).
    secrets:
      TAILSCALE_CLIENT_ID: ${{ secrets.TAILSCALE_CLIENT_ID }}
      TAILSCALE_CLIENT_SECRET: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_RW: ${{ secrets.DOCKERHUB_RW }}
