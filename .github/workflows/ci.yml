  # A family's clusters die with THAT family, not with the whole run.
  #
  # One kill job waiting on all three meant the compose clusters idled until k8s
  # and swarm were also done — and the wait is the slowest OS leg of each, so a
  # single slow (or wedged) Windows leg kept all SIX clusters alive, holding
  # runner slots the queue needed. That is how one hung leg starved the next run
  # into a ten-minute cluster wait it never recovered from.
  #
  # Three jobs, one per family, each cancelling only its own pair. k8s typically
  # finishes several minutes before the others and now hands its two slots back
  # there and then. The cluster runs' own idle-until-caller-done stays the
  # backstop for whatever these miss.
  kill-compose:
    name: kill compose clusters
    needs: [start-cluster, e2e-compose]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write # cancel the cluster runs
      contents: read
    steps:
      # No checkout here, so pass --repo explicitly, otherwise the cancel silently
      # fails and the cluster runs sleep out their full TTL.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel ${{ needs.start-cluster.outputs.cluster_id_a }} --repo ${{ github.repository }} || true
          gh run cancel ${{ needs.start-cluster.outputs.cluster_id_b }} --repo ${{ github.repository }} || true

  kill-k8s:
    name: kill k8s clusters
    needs: [start-cluster, e2e-k8s]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel ${{ needs.start-cluster.outputs.k8s_id_a }} --repo ${{ github.repository }} || true
          gh run cancel ${{ needs.start-cluster.outputs.k8s_id_b }} --repo ${{ github.repository }} || true

  kill-swarm:
    name: kill swarm clusters
    needs: [start-cluster, e2e-swarm]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel ${{ needs.start-cluster.outputs.swarm_id_a }} --repo ${{ github.repository }} || true
          gh run cancel ${{ needs.start-cluster.outputs.swarm_id_b }} --repo ${{ github.repository }} || true
