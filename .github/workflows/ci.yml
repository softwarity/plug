name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # plug's own code, built and unit-tested NATIVELY on all three OSes. The e2e
  # Docker matrix (see e2e.yml) can only run on Linux runners, so this is where
  # macOS and Windows get real coverage: vet + the unit suite on each.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        run: go test ./...

  # The visible cross-platform proof: build plug natively on each OS and loop
  # real traffic through a real TUN device BY NAME (no agent, no Docker). This is
  # where macOS and Windows show their TUN data path actually works, not just
  # that the code compiles.
  selftest:
    name: TUN selftest (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build plug
        working-directory: cli
        shell: bash
        run: go build -o "plug${{ runner.os == 'Windows' && '.exe' || '' }}" .

      - name: selftest — real utun/tun by name (under sudo)
        if: runner.os != 'Windows'
        working-directory: cli
        shell: bash
        run: |
          set -o pipefail
          sudo ./plug selftest 2>&1 | tee out.txt
          grep -q "SELFTEST-OK" out.txt
          echo "### TUN selftest — ${{ runner.os }} ✅ real device, traffic round-tripped by name" >> "$GITHUB_STEP_SUMMARY"

      - name: selftest — WinTUN by name (best-effort, needs the driver)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: cli
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun -Force
          Copy-Item wintun/wintun/bin/amd64/wintun.dll .
          ./plug.exe selftest 2>&1 | Tee-Object -FilePath out.txt
          if (Select-String -Path out.txt -Pattern "SELFTEST-OK") {
            "### TUN selftest — Windows ✅ WinTUN, traffic round-tripped by name" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          } else {
            "### TUN selftest — Windows ⚠️ WinTUN unavailable on this runner (driver/elevation)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            exit 1
          }

  # One-glance platform grid in the run Summary: plug built + unit-tested AND its
  # real TUN device exercised by name, on each OS. (The e2e protocol matrix is
  # Linux-only — Docker — so THIS is where macOS/Windows coverage shows.)
  platforms:
    name: Platform coverage
    needs: [test, selftest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render platform grid
        run: |
          t='${{ needs.test.result }}'; s='${{ needs.selftest.result }}'
          cell() { [ "$1" = success ] && echo "✅" || echo "⚠️ see jobs"; }
          {
            echo "## Platform coverage — plug built + the real TUN exercised on each OS"
            echo
            echo "| Platform | Build + unit tests | TUN selftest (real device, by name) |"
            echo "|---|---|---|"
            echo "| 🍎 macOS   | $(cell "$t") | $(cell "$s") |"
            echo "| 🪟 Windows | $(cell "$t") | $(cell "$s") |"
            echo "| 🐧 Linux   | $(cell "$t") | $(cell "$s") |"
            echo
            echo "_Per-OS detail in the Test / TUN selftest jobs. The e2e protocol matrix (7 services × 4 languages) is Linux-only._"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build CLI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cross-compile
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            echo "building $goos/$goarch"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags '-s -w' \
              -o "../dist/plug-$goos-$goarch$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: plug-binaries
          path: dist/*
          if-no-files-found: error

  image:
    name: Build & publish image
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/_docker.yml
    secrets: inherit
