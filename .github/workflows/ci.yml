name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # manual e2e-over-the-mesh run

# One pipeline per branch: two close pushes used to run TWO full pipelines at
# once (12 dispatched clusters + 18 legs for 20 runner slots) and the starved
# serve jobs queued past the legs' 10-min cluster wait. Only the newest commit
# needs blessing — cancel the older run; its clusters die on their TTL
# backstop (that is what the backstop is for).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # plug's own code, built and unit-tested NATIVELY on all three OSes. Each job
  # records its real PASS/FAIL as an artifact the `platforms` job reads back.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        shell: bash
        env:
          # -race, or the concurrency tests prove nothing: rearm_race_test.go is
          # written to fail OUTRIGHT under the detector and merely to be flaky
          # without it, so a plain `go test` would let a dropped mutex through.
          # Not on Windows: the detector needs cgo and a C toolchain the runner
          # does not guarantee, and none of this concurrency is OS-specific.
          # Written this way round on purpose: in GitHub expressions '' is FALSY,
          # so `windows && '' || '-race'` would hand Windows the -race it excludes.
          RACE: ${{ matrix.os != 'windows-latest' && '-race' || '' }}
        run: go test $RACE ./...
      - name: Record result
        if: always()
        shell: bash
        run: mkdir -p plat && printf '%s' "${{ job.status }}" > "plat/test-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plat-test-${{ matrix.os }}
          path: plat/*.txt
          # 30 days, not 1: the release gate re-reads these markers to decide
          # whether a tagged commit is publishable, and a tag can be cut days
          # after the commit. Expired markers would fail the gate closed for a
          # reason that has nothing to do with the code. They are 170 bytes.
          retention-days: 30

  # The visible cross-platform proof: build plug natively on each OS and loop real
  # traffic through a real TUN device BY NAME (no agent, no Docker). macOS/Linux
  # run it under sudo and MUST pass. Windows is best-effort (WinTUN driver): the
  # step records the honest PASS/FAIL and never masquerades as a pass it isn't.
  selftest:
    name: TUN selftest (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: selftest
        shell: bash
        # Windows is WIP (WinTUN route config unfinished) — tolerate its failure;
        # the marker still records the real result for the grid.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          PLAT_OS: ${{ matrix.os }}
        run: bash scripts/selftest.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plat-selftest-${{ matrix.os }}
          path: cli/plat/*.txt
          retention-days: 30 # the release gate re-reads them; see plat-test above

  # One-glance platform grid in the run Summary, from the REAL per-OS results
  # (not the job status — the Windows selftest is continue-on-error, so its true
  # PASS/FAIL only lives in the marker it wrote).
  platforms:
    name: Platform coverage
    needs: [test, selftest]
    if: always()
    runs-on: ubuntu-latest
    # The verdict the image gate reads. It comes from the MARKERS, because the
    # job statuses cannot answer this: the Windows selftest is continue-on-error,
    # so a real FAIL leaves its job green — 33f8c40 published an image that way.
    outputs:
      verdict: ${{ steps.grid.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: plat
          pattern: plat-*
          merge-multiple: true
      - name: Render platform grid
        id: grid
        run: bash scripts/platform-grid.sh plat

  build:
    name: Build CLI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # The agent helper is its own module — vet/build/test it here (the e2e only
      # compiled it into the cluster image; nothing caught a vet issue or ran its
      # unit tests).
      - name: Vet & test the agent helper
        working-directory: agent/helper
        run: go vet ./... && go build ./... && go test -race ./...
      - name: Cross-compile
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            echo "building $goos/$goarch"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags '-s -w' \
              -o "../dist/plug-$goos-$goarch$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: plug-binaries
          path: dist/*
          if-no-files-found: error

  # The e2e clients, built ONCE for every leg.
  #
  # Measured on the Windows swarm leg: 493s of a 769s setup went into building
  # them — and each of the three Windows legs paid it in full, for artefacts
  # that do not differ. What changes from one leg to the next is the CLUSTER in
  # front of the client, never the client. So: one Linux runner cross-compiles
  # the Go client and the two helpers (no cgo anywhere in them), builds the jar
  # once (bytecode), installs node_modules once (every driver here is pure JS),
  # and ships the lot. Python stays per-leg — its wheels are compiled.
  #
  # This does NOT depend on `test`: it compiles nothing plug ships, so making it
  # wait would only push the legs' start out.
  build-clients:
    name: Build the e2e clients (once, for every leg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # Keyed on the e2e client's own go.sum — the module fetch is the slow
          # half. It is worth caching HERE, where it happens once, in a way it
          # never was on ten legs racing to write the same key.
          cache: true
          cache-dependency-path: e2e/clients/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-Linux-${{ hashFiles('e2e/clients/node/package.json') }}
          restore-keys: npm-Linux-
      - name: Build them
        run: bash scripts/ci/build-clients.sh e2e-clients
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-clients
          path: e2e-clients/*
          if-no-files-found: error # a leg with no bundle rebuilds everything, silently slow
          retention-days: 1

  # Build FIRST, so the e2e legs run against the image we actually publish
  # instead of one they build themselves. It carries only `sha-<short>` at this
  # point: a digest nobody has exercised must never be what `latest` points at.
  image-build:
    name: Build image (immutable tag only)
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_docker.yml
    with:
      immutable_only: true
    secrets: inherit

  image:
    name: Publish the tested image
    # Publish ONLY once EVERY test has passed — unit tests, the TUN selftests on
    # all three OSes, and the full mesh e2e on BOTH cluster families (compose
    # and kubernetes: protocol matrix + multicluster + takeover, ×3 OS each). An
    # image must never ship from a commit the e2e didn't bless. A fully green
    # MANUAL dispatch publishes too ("a manual build is a whole build").
    # main publishes `latest` (+ the `main` tag); ANY OTHER branch publishes ONLY
    # its own `:<branch>` tag (metadata-action tags by ref and gates `latest` to
    # is_default_branch) — a throwaway image to test that branch on a real
    # cluster, never latest. Off PRs (secrets). Delete stale branch tags from
    # Docker Hub after merge.
    #
    # `needs: selftest` is NOT enough on its own: that job is continue-on-error on
    # Windows, so it reports success on a selftest that failed. The verdict from
    # `platforms` reads the markers those jobs wrote, which is the only record
    # that cannot lie — without it the image of 33f8c40 shipped with a red
    # Windows selftest, past a comment promising the opposite.
    needs: [image-build, build, selftest, platforms, e2e-compose, e2e-k8s, e2e-swarm]
    if: success() && needs.platforms.outputs.verdict == 'pass' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true # a release is recognised by the tag pointing at HEAD
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      # A new manifest list over the SAME digests the e2e legs just ran against.
      # Nothing is rebuilt, so "what we publish" and "what was tested" are the
      # same bytes — which was NOT true while the legs built their own image.
      #
      # Publishing is not a special act reserved for releases: it is one rule,
      # and the ref decides which names the tested digest earns.
      #
      #   any branch            → :<branch>
      #   the default branch    → :latest as well
      #   a v-tag on HEAD       → :x.y.z, :x.y and :x on top
      #
      # A release used to be a separate workflow, triggered by the tag, waiting
      # on this very run to finish before promoting. That existed because the tag
      # once REBUILT the image; it does not any more. Folding it back here
      # removes the gate that re-asks what this job already knows, the race
      # between release-flow's two pushes, and the manual re-run when either side
      # tripped — which is exactly what 2.10.0 cost.
      #
      # The one case it drops: a tag pushed onto a commit built EARLIER publishes
      # nothing, since this job has already run for it. Re-run the CI on that
      # commit and it lands.
      - name: Put the names this ref earns on the tested digest
        env:
          IMAGE: docker.io/softwarity/plug
          SRC: ${{ needs.image-build.outputs.image }}
        run: |
          branch="${GITHUB_REF_NAME//\//-}"   # a docker tag cannot carry a slash
          tags="-t $IMAGE:$branch"
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tags="$tags -t $IMAGE:latest"
          fi
          v=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$v" ]; then
            ver=${v#v}; maj=${ver%%.*}; min=${ver#*.}; min=${min%%.*}
            # The image itself is stamped with this version (see "Resolve
            # version" in _docker.yml), so the semver tags and the binaries
            # inside them cannot disagree: same commit, same build, one truth.
            tags="$tags -t $IMAGE:$ver -t $IMAGE:$maj.$min -t $IMAGE:$maj"
            echo "release $ver — publishing the semver tags too"
          fi
          echo "promoting $SRC → $tags"
          docker buildx imagetools create $tags "$SRC"
          docker buildx imagetools inspect "$IMAGE:$branch" | head -5

  # The e2e that native-Linux Docker can't give us: run plug NATIVELY on each OS
  # against a REAL cluster, reaching services BY NAME over a Tailscale mesh (the
  # cluster can't be Linux containers on a mac/win runner, so it runs ONCE on its
  # own Linux run and every client joins it). THREE FAMILIES of clusters, same
  # e2e chain against each: compose-for.yml (docker compose), k8s-for.yml (kind
  # — real upstream Kubernetes, the agent from the published deploy/plug-k8s.yaml)
  # and swarm-for.yml (single-node Swarm — the agent as a Swarm service on a
  # non-attachable overlay). Part of CI, not a separate workflow; runs on EVERY
  # branch push (so any branch gets its full mesh-blessed image). Off PRs — it's
  # heavy and needs the Tailscale/Docker secrets, absent on fork PRs. Needs
  # TAILSCALE_CLIENT_ID/SECRET.
  #
  # Deliberately NOT behind `needs: test`: this job only DISPATCHES the cluster
  # workflows, and the e2e legs then wait for those clusters to come up inside
  # their own setup step. Gating it on the unit tests put a full minute of pure
  # sequence in front of every run (the Windows leg is the long pole) AND held
  # the clusters' own build back by as much again. The gate that matters is kept
  # where it belongs: the e2e jobs below need `test`, so nothing is ever
  # exercised against code whose unit tests are red. The cost is that a red push
  # dispatches clusters for nothing — the kill jobs still reap them (they run on
  # always() as long as this job succeeded, e2e skipped or not).
  start-cluster:
    name: start clusters
    # NOT waiting for image-build. This job only DISPATCHES; what needs the image
    # is a job inside each cluster run, several steps later — and the reference
    # is predictable (sha-<commit>), so it can be handed over before it exists.
    # The cluster's pull waits for it while the runner boots, checks out and
    # joins the tailnet. Making the dispatch wait for the build serialised two
    # things that have no reason to be in sequence.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch the cluster runs
      contents: read
    outputs:
      cluster_id_a: ${{ steps.dispatch_a.outputs.id }}
      cluster_id_b: ${{ steps.dispatch_b.outputs.id }}
      k8s_id_a: ${{ steps.dispatch_ka.outputs.id }}
      k8s_id_b: ${{ steps.dispatch_kb.outputs.id }}
      swarm_id_a: ${{ steps.dispatch_sa.outputs.id }}
      swarm_id_b: ${{ steps.dispatch_sb.outputs.id }}
    steps:
      - uses: actions/checkout@v6
      # The tag metadata-action will put on this build: sha-<7>. Computed here so
      # the dispatch does not have to wait for the build that produces it.
      - id: ref
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      # TWO clusters per family, so the e2e can assert multicluster: the same
      # service name must reach the RIGHT backend through each plug (each
      # cluster's `ident` answers its own corr id).
      - id: dispatch_a
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-a)" >> "$GITHUB_OUTPUT"
      - id: dispatch_b
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-b)" >> "$GITHUB_OUTPUT"
      - id: dispatch_ka
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-ka k8s-for.yml)" >> "$GITHUB_OUTPUT"
      - id: dispatch_kb
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-kb k8s-for.yml)" >> "$GITHUB_OUTPUT"
      - id: dispatch_sa
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-sa swarm-for.yml)" >> "$GITHUB_OUTPUT"
      - id: dispatch_sb
        env:
          GH_TOKEN: ${{ github.token }}
          CLUSTER_IMAGE: docker.io/softwarity/plug:sha-${{ steps.ref.outputs.short }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }}-sb swarm-for.yml)" >> "$GITHUB_OUTPUT"
      # The compat cell needs the LAST PUBLISHED launcher for every OS, but only
      # this Linux job has Docker — extract all of them from the published image
      # here and ship them to the mac/win legs as an artifact.
      - name: Extract the latest published launchers
        run: |
          docker create --name pl docker.io/softwarity/plug:latest >/dev/null
          mkdir -p latest-launchers
          for b in plug-linux-amd64 plug-linux-arm64 plug-darwin-amd64 plug-darwin-arm64 plug-windows-amd64.exe; do
            docker cp "pl:/opt/plug/bin/$b" "latest-launchers/$b"
          done
          docker rm pl >/dev/null
          ls -la latest-launchers/
      - uses: actions/upload-artifact@v7
        with:
          name: latest-launchers
          path: latest-launchers/*
          retention-days: 1

  e2e-compose:
    name: e2e-compose (${{ matrix.os }}, by name over the mesh)
    needs: [test, start-cluster, build-clients]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # a hung cell must not run the job (and the cluster) for hours
    env:
      A: plug-cluster-${{ github.run_id }}-a
      B: plug-cluster-${{ github.run_id }}-b
      # Where the shared client bundle lands (relative to the workspace, so Git
      # Bash on Windows reads it the same way every other shell does).
      PREBUILT_CLIENTS: e2e-clients
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        # ubuntu-24.04-arm is the leg that was missing: linux/arm64 has been
        # built and published on every release since the multi-arch image
        # existed, and NOTHING ever ran it — every leg was amd64. Same cluster,
        # same cells, a native arm64 client. Compose only: the gap is the
        # ARCHITECTURE, and replaying it on three families would cost three
        # times as much to learn the same thing.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # `alias` exists for ONE reason: a Tailscale hostname must be a DNS
        # label, and ubuntu-24.04-arm is the only runner name carrying dots.
        # GitHub expressions have no replace(), so the safe name is carried by
        # the matrix instead of computed from it.
        #
        # The arm64 leg runs everything whose names it can own: the cells that
        # create their own names through -s now derive them from $leg, so a
        # second Linux leg no longer claims exposed-linux, col-linux, lease-linux
        # and the rest from under the amd64 one (measured — it took that leg down
        # with it, not just itself).
        #
        # What it still skips are the cells bound to services the CLUSTER
        # declares per leg: flaky-<leg>, tko-<leg>, res-tko-<leg>, res-agent-<leg>,
        # prev-agent-<leg>. Those exist for linux/mac/win only, and adding a
        # fourth set would double the Linux load on a shared cluster to re-prove
        # AGENT behaviour — which cannot depend on the client's architecture,
        # since the agent is the same amd64 container in every leg.
        include:
          - os: ubuntu-latest
            alias: ubuntu
          - os: ubuntu-24.04-arm
            alias: ubuntu-arm
          - os: macos-latest
            alias: macos
          - os: windows-latest
            alias: windows
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the compat cell decides by ANCESTRY (launcher rev vs fix commit)
      # Only where the full language grid runs: with E2E_LANGS=go there is no
      # jar to launch, and a JDK download is 20-30s of nothing on six legs.
      - uses: actions/setup-java@v4 # pin the JRE — the runners' ambient Java differs by OS; no maven cache, nothing builds here
        if: env.E2E_LANGS == ''
        with:
          distribution: temurin
          java-version: '21'
      # Building the four language clients used to be the single biggest slice of
      # a leg — 493s of a 769s setup on Windows, paid again by each of the three
      # Windows legs for bytes that were identical. build-clients does it once
      # (see scripts/ci/build-clients.sh); this leg takes delivery.
      #
      # Go is not set up here any more: nothing on a leg compiles when the
      # bundle is present. The fallback in e2e-matrix.sh uses whichever Go the
      # runner image ships, which is the right cost for a case that should not
      # happen.
      - uses: actions/download-artifact@v7
        with:
          name: e2e-clients
          path: e2e-clients
      # Python is the one client that cannot be shared: psycopg2-binary and
      # grpcio are compiled wheels. It costs 42s, and unlike the npm cache —
      # which pointed at ~/.npm and therefore NEVER hit on Windows, where npm
      # caches in %LocalAppData% — this one is right on all three.
      - uses: actions/cache@v4
        if: env.E2E_LANGS == '' # nothing pips on a Go-only leg
        with:
          # One path per OS; actions/cache ignores the ones that do not exist.
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('e2e/clients/python/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-${{ matrix.alias }}-${{ github.run_id }}
          args: --accept-dns=false # reach the cluster by tailnet IP; don't let Tailscale drive DNS
      - uses: actions/download-artifact@v7 # the last published launchers, for the compat cell
        with:
          name: latest-launchers
          path: latest-launchers
      # One family per step so each shows its own green/red in the run view. The
      # setup step installs plug FROM the cluster + builds the clients and records
      # the shared state ($RUNNER_TEMP) the family steps read back. Families run
      # with `if: always()` so one failing never hides the others (Git Bash on
      # Windows too). The compat step closes the set: the last published launcher
      # must still drive THIS branch's core (the inter-version channel).
      - name: Setup — install plug from the cluster + build clients
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh setup "$A" "$B" 2222
      - name: Env passthrough
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh env "$A" "$B" 2222
      - name: Protocol matrix (4 langs × 8 protocols)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh matrix "$A" "$B" 2222
      - name: Multicluster (simultaneous)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multicluster "$A" "$B" 2222
      - name: Outage recovery
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh outage "$A" "$B" 2222
      - name: Expose — serve a local port to the cluster (-s)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh expose "$A" "$B" 2222
      - name: Expose, named port — plug picks it, {PORT} carries it into the command
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh exposevar "$A" "$B" 2222
      - name: Gateway callback (external → published gateway → sink)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh gateway "$A" "$B" 2222
      - name: Collision — a name already taken is refused
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh collision "$A" "$B" 2222
      - name: Name lease — a swept signpost must not free a live name
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh lease "$A" "$B" 2222
      - name: Same cluster port — two names, both reachable
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh sameport "$A" "$B" 2222
      - name: Multi-port — one name, three cluster ports
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multiport "$A" "$B" 2222

      - name: Takeover — park the deployed service, serve ours, restore it
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh takeover "$A" "$B" 2222
      - name: Resilience — agent restarted mid-session (self-heal, boot-gc, re-park)
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh resilience "$A" "$B" 2222
      - name: Launcher compat — latest published launcher, this branch's core
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/compat-launcher.sh "$A" 2222
      # Last on purpose: its docker-backend pull attempt targets the res-agent's
      # local-only :e2e tag (clean failure by design) — nothing after it depends
      # on that agent's image anymore.
      - name: Update — plug update verb + launcher path (per-leg agent)
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh update "$A" "$B" 2222
      # The published-release agents (2.4.1) live for these two. REFUSALS FIRST:
      # one of them needs an agent that predates `update <tag>`, and on Swarm/k8s
      # the jump below actually rolls that agent forward — after which it is no
      # longer old enough to prove anything.
      - name: Update — <tag> refuses an unpublished tag, and an agent too old
        if: always() && matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatetag "$A" "$B" 2222
