    name: e2e-arm64 (a native arm64 client, on the compose cluster)
    needs: [test, start-cluster, build-clients]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      A: plug-cluster-${{ github.run_id }}-a
      B: plug-cluster-${{ github.run_id }}-b
      AGENT_IMAGE: docker.io/softwarity/plug:sha-${{ needs.start-cluster.outputs.short_sha }}-amd64
      PREBUILT_CLIENTS: e2e-clients
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          name: e2e-clients
          path: e2e-clients
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: pip-${{ runner.os }}-arm64-${{ hashFiles('e2e/clients/python/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-arm64-
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-ubuntu-arm-${{ github.run_id }}
          args: --accept-dns=false # reach the cluster by tailnet IP; don't let Tailscale drive DNS
      - name: Setup — install plug from the cluster + build clients
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh setup "$A" "$B" 2222
      - name: Env passthrough
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh env "$A" "$B" 2222
      - name: Protocol matrix (4 langs × 8 protocols)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh matrix "$A" "$B" 2222
      - name: Multicluster (simultaneous)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multicluster "$A" "$B" 2222
      - name: Expose — serve a local port to the cluster (-s)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh expose "$A" "$B" 2222
      - name: Expose, named port — plug picks it, {PORT} carries it into the command
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh exposevar "$A" "$B" 2222
      - name: Gateway callback (external → published gateway → sink)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh gateway "$A" "$B" 2222
      - name: Collision — a name already taken is refused
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh collision "$A" "$B" 2222
      - name: Name lease — a swept signpost must not free a live name
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh lease "$A" "$B" 2222
      - name: Same cluster port — two names, both reachable
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh sameport "$A" "$B" 2222
      - name: Multi-port — one name, three cluster ports
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multiport "$A" "$B" 2222

