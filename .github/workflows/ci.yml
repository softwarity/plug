      # it compares EVERY step that runs something, not merely this block. So
      # there is no place for a cell one family needs and the others do not: the
      # guard would refuse it. That is the strictness working, not a gap. A real
      # need for one is the moment to teach that script where the block ends,
      # deliberately, rather than to work around it here.
