name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # plug's own code, built and unit-tested NATIVELY on all three OSes. The e2e
  # Docker matrix (see e2e.yml) can only run on Linux runners, so this is where
  # macOS and Windows get real coverage: vet + the unit suite on each.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        run: go test ./...

  build:
    name: Build CLI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Cross-compile
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            echo "building $goos/$goarch"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags '-s -w' \
              -o "../dist/plug-$goos-$goarch$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: plug-binaries
          path: dist/*
          if-no-files-found: error

  image:
    name: Build & publish image
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/_docker.yml
    secrets: inherit
