        shell: bash
        run: bash scripts/ci/e2e-matrix.sh resilience "$A" "$B" 2222
      - name: Launcher compat — latest published launcher, this branch's core
        if: always()
        shell: bash
        run: bash scripts/ci/compat-launcher.sh "$A" 2222
      - name: Update — plug update verb + launcher path (per-leg agent)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh update "$A" "$B" 2222
      - name: Update — <tag> refuses an unpublished tag, and an agent too old
        if: always()
