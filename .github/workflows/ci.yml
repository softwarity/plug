        run: bash scripts/ci/e2e-matrix.sh updatejump "$A" "$B" 2222
  e2e-swarm:
    name: e2e-swarm (${{ matrix.os }}, same chain on swarm)
    needs: [test, start-cluster, build-clients]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      A: plug-swarm-${{ github.run_id }}-${{ github.run_attempt }}-sa
      B: plug-swarm-${{ github.run_id }}-${{ github.run_attempt }}-sb
      AGENT_IMAGE: docker.io/softwarity/plug:sha-${{ needs.start-cluster.outputs.short_sha }}-amd64
      # Where the shared client bundle lands (relative to the workspace, so Git
      # Bash on Windows reads it the same way every other shell does).
      PREBUILT_CLIENTS: e2e-clients
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6 # pin the JRE — the runners' ambient Java differs by OS; no maven cache, nothing builds here
        with:
          distribution: temurin
          java-version: '21'
      # Building the four language clients used to be the single biggest slice of
      # a leg — 493s of a 769s setup on Windows, paid again by each of the three
      # Windows legs for bytes that were identical. build-clients does it once
      # (see scripts/ci/build-clients.sh); this leg takes delivery.
      #
      # Go is not set up here any more: nothing on a leg compiles when the
      # bundle is present. The fallback in e2e-matrix.sh uses whichever Go the
      # runner image ships, which is the right cost for a case that should not
      # happen.
      - uses: actions/download-artifact@v7
        with:
          name: e2e-clients
          path: e2e-clients
      # Python is the one client that cannot be shared: psycopg2-binary and
      # grpcio are compiled wheels. It costs 42s, and unlike the npm cache —
      # which pointed at ~/.npm and therefore NEVER hit on Windows, where npm
      # caches in %LocalAppData% — this one is right on all three.
      - uses: actions/cache@v6
        with:
          # One path per OS; actions/cache ignores the ones that do not exist.
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('e2e/clients/python/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - uses: actions/download-artifact@v7 # the last published launchers, for the compat cell
        with:
          name: latest-launchers
          path: latest-launchers
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-swarm-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-dns=false # reach the cluster by tailnet IP; don't let Tailscale drive DNS
      # And v4 points macOS at MagicDNS on its own once the tunnel is up
      # (networksetup -setdnsservers Ethernet 100.100.100.100, plus a search
      # domain). --accept-dns=false does not stop it: the flag tells the client
      # not to touch DNS, the action then does it anyway, afterwards. That
      # resolver serves the tailnet and nothing else here, so every public name
      # stopped resolving and the step right below died with ENOTFOUND fetching
      # an artifact, before plug was even installed. We reach the cluster by
      # tailnet IP, so hand the resolver straight back. "Ethernet" is the
      # service name the action itself hardcodes.
      - name: Take macOS DNS back from Tailscale
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo networksetup -setdnsservers Ethernet empty
          sudo networksetup -setsearchdomains Ethernet empty
          sudo dscacheutil -flushcache || true # belt and braces, not the assertion
          # Prove it through getaddrinfo, which is what the next action resolves
          # with. Without this the symptom surfaces one step later, as someone
          # else's ENOTFOUND.
          for i in $(seq 1 10); do
            python3 -c "import socket; socket.getaddrinfo('api.github.com', 443)" 2>/dev/null && exit 0
            sleep 1
          done
          echo "public DNS is still broken after handing the resolver back"
          exit 1
      # ── THE COMMON BLOCK ─────────────────────────────────────────────────
      # Identical, to the character, in e2e-compose, e2e-swarm and e2e-k8s: the
      # same cells, in the same order, under the same names. That is the point.
      # These assertions are about PLUG, and plug must behave the same whichever
      # backend provisions the name — so seeing three identical lists side by
      # side is what makes a family-specific divergence visible at a glance.
      #
      # The names say what is ASSERTED, never how the backend does it: "park the
      # deployed service" is one test, whether the script stops a container,
      # scales a service to 0 or repoints a Service. Naming the mechanism made
      # three identical tests look like three different ones.
      #
      # scripts/ci/check-common-block.sh fails the build if the three drift, and
      # it compares EVERY step that runs something, not merely this block. So
      # there is no place for a cell one family needs and the others do not: the
      # guard would refuse it. That is the strictness working, not a gap. A real
      # need for one is the moment to teach that script where the block ends,
      # deliberately, rather than to work around it here.
      - name: Setup — install plug from the cluster + build clients
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh setup "$A" "$B" 2222
      - name: Env passthrough
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh env "$A" "$B" 2222
      - name: Protocol matrix (4 langs × 8 protocols)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh matrix "$A" "$B" 2222
      - name: Multicluster (simultaneous)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multicluster "$A" "$B" 2222
      - name: Container member, an unmodified image in the cluster (--dockerrun)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh dockerrun "$A" "$B" 2222
      - name: Key mount, the profile's own key carried into the sidecar (--dockerrun)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh keymount "$A" "$B" 2222
      - name: Outage recovery
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh outage "$A" "$B" 2222
      - name: Expose — serve a local port to the cluster (-s)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh expose "$A" "$B" 2222
      - name: Expose, named port — plug picks it, {PORT} carries it into the command
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh exposevar "$A" "$B" 2222
      - name: Gateway callback (external → published gateway → sink)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh gateway "$A" "$B" 2222
      - name: Collision — a name already taken is refused
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh collision "$A" "$B" 2222
      - name: Name lease — a swept signpost must not free a live name
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh lease "$A" "$B" 2222
      - name: Same cluster port — two names, both reachable
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh sameport "$A" "$B" 2222
      - name: Multi-port — one name, three cluster ports
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh multiport "$A" "$B" 2222
      - name: Takeover — park the deployed service, serve ours, restore it
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh takeover "$A" "$B" 2222
      - name: Resilience — agent restarted mid-session (self-heal, boot-gc, re-park)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh resilience "$A" "$B" 2222
      - name: Launcher compat — latest published launcher, this branch's core
        if: always()
        shell: bash
        run: bash scripts/ci/compat-launcher.sh "$A" 2222
      - name: Update — plug update verb + launcher path (per-leg agent)
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh update "$A" "$B" 2222
      - name: Update — <tag> refuses an unpublished tag, and an agent too old
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatetag "$A" "$B" 2222
      - name: Update — the background check finds it, the next launch says it
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatenotify "$A" "$B" 2222
      - name: Update — a release agent retargets to the newest release
        if: always()
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh updatejump "$A" "$B" 2222
  kill-compose:
    name: kill compose clusters
    # e2e-arm64 runs on the SAME compose clusters and starts later, because the
    # ARM pool is scarce. Killing them on e2e-compose alone pulled the cluster
    # out from under it, and "it is still running when the clusters die" is the
    # normal case rather than the unlucky one.
    needs: [start-cluster, e2e-compose, e2e-arm64]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write # cancel the cluster runs
      contents: read
    steps:
      # No checkout here, so pass --repo explicitly, otherwise the cancel silently
      # fails and the cluster runs sleep out their full TTL.
      #
      # `|| true` used to hide exactly the failure the --repo fix was about. A
      # 403 from a narrowed token, a 502, an id the dispatch never recorded: all
      # four outcomes looked the same from outside, a green step, while the
      # cluster kept a runner out of a 20-runner pool for the rest of its TTL.
      # Only "it had already finished" is normal here; the rest gets annotated,
      # and the job still passes so a stuck cancel never reds a good pipeline.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in "${{ needs.start-cluster.outputs.cluster_id_a }}:compose-a" \
                      "${{ needs.start-cluster.outputs.cluster_id_b }}:compose-b"; do
            id="${pair%%:*}"; who="${pair##*:}"
            if [ -z "$id" ]; then
              echo "::warning::no run id was recorded for the $who cluster: if it was dispatched, nothing cancels it and it holds a runner until its TTL expires"
            elif out="$(gh run cancel "$id" --repo "${{ github.repository }}" 2>&1)"; then
              echo "cancelled the $who cluster, run $id"
            else
              case "$out" in
                *"Cannot cancel a workflow run that is completed"*)
                  echo "the $who cluster (run $id) had already finished" ;;
                *)
                  echo "::warning::could not cancel the $who cluster, run $id: $out. It holds a runner until its TTL expires." ;;
              esac
            fi
          done

  kill-k8s:
    name: kill k8s clusters
    needs: [start-cluster, e2e-k8s]
    if: always() && needs.start-cluster.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # Same shape as kill-compose, and for the same reason: a cancel that fails
      # must not look like a cancel that worked. These two idle for 2100s.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
