  # The arm64 client. This asks an ARCHITECTURE question — does a NATIVE arm64
  # plug reach cluster services by name — not a cluster-family one. It used to be
  # a fourth leg of e2e-compose, which made three matrices that should read as
  # one comparison look like two identical blocks and an odd one out.
  #
  # linux/arm64 has been built and published on every release since the
  # multi-arch image existed, and nothing ever ran it: every leg was amd64.
  #
  # It borrows the compose cluster — the lightest — and owns its own names: the
  # cells that create names through -s derive them from $leg, which tells the
  # architectures apart (before that, this leg claimed exposed-linux and took the
  # amd64 leg down with it, measured). What it does NOT run are the cells bound
  # to services the CLUSTER declares per leg — flaky-<leg>, tko-<leg>, res-*,
  # prev-agent-<leg> — which exist for linux/mac/win only. A fourth set would
  # double the Linux load on a shared cluster to re-prove AGENT behaviour, and
  # the agent is the same amd64 container whatever the client's architecture.
