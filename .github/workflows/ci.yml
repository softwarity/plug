      # with `if: always()` so one failing never hides the others (Git Bash on
      # Windows too). The compat step closes the set: the last published launcher
      # must still drive THIS branch's core (the inter-version channel).
      # ── THE COMMON BLOCK ─────────────────────────────────────────────────
      # Identical, to the character, in e2e-compose, e2e-swarm and e2e-k8s: the
      # same cells, in the same order, under the same names. That is the point.
      # These assertions are about PLUG, and plug must behave the same whichever
      # backend provisions the name — so seeing three identical lists side by
      # side is what makes a family-specific divergence visible at a glance.
      #
      # The names say what is ASSERTED, never how the backend does it: "park the
      # deployed service" is one test, whether the script stops a container,
      # scales a service to 0 or repoints a Service. Naming the mechanism made
      # three identical tests look like three different ones.
