          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-${{ matrix.alias }}-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-dns=false # reach the cluster by tailnet IP; don't let Tailscale drive DNS
      # And v4 points macOS at MagicDNS on its own once the tunnel is up
      # (networksetup -setdnsservers Ethernet 100.100.100.100, plus a search
      # domain). --accept-dns=false does not stop it: the flag tells the client
      # not to touch DNS, the action then does it anyway, afterwards. That
      # resolver serves the tailnet and nothing else here, so every public name
      # stopped resolving and the step right below died with ENOTFOUND fetching
      # an artifact, before plug was even installed. We reach the cluster by
      # tailnet IP, so hand the resolver straight back. "Ethernet" is the
      # service name the action itself hardcodes.
