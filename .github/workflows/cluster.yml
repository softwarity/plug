name: cluster

# The e2e "cluster", on its own run so it lives separately from the tests. It is
# started (and later cancelled) by e2e-mesh.yml via `gh workflow run` /
# `gh run cancel`. It brings up the agent + services, joins the Tailscale tailnet
# under a name derived from the caller's run id, and idles until cancelled — so a
# macOS/Windows runner on the same tailnet can reach it BY NAME through plug.
#
# Requires repo secrets TS_OAUTH_ID / TS_OAUTH_SECRET (a Tailscale OAuth client
# tagged tag:ci). Dispatch-only by design.
on:
  workflow_dispatch:
    inputs:
      corr:
        description: correlation id (the caller's run id) — names the tailnet node
        required: true

run-name: cluster-for-${{ inputs.corr }}

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: plug-cluster-${{ inputs.corr }}
      - name: Serve the cluster (idle until cancelled)
        env:
          PLUG_CLUSTER_TTL: "1800"
        run: bash scripts/ci/cluster-serve.sh
