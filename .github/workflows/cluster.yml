name: cluster

# The e2e "cluster", on its own run so it lives separately from the tests. It is
# started (and later cancelled) by e2e-mesh.yml via `gh workflow run` /
# `gh run cancel`. It brings up the agent + services, joins the Tailscale tailnet
# under a name derived from the caller's run id, and idles until cancelled — so a
# macOS/Windows runner on the same tailnet can reach it BY NAME through plug.
#
# Requires repo secrets TAILSCALE_CLIENT_ID / TAILSCALE_CLIENT_SECRET (a Tailscale
# OAuth client tagged tag:ci). Dispatch-only by design.
on:
  workflow_dispatch:
    inputs:
      corr:
        description: correlation id (the caller's run id) — names the tailnet node
        required: true

run-name: cluster-for-${{ inputs.corr }}

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # THE image under test: the agent is built HERE, from this branch, before
      # anything joins the mesh — it then serves both the cluster services and
      # the plug installer/binaries that every OS leg installs from.
      - name: Build the agent image (this branch)
        run: |
          docker build -f agent/Dockerfile -t softwarity/plug:e2e .
          # --entrypoint: the image's entrypoint ignores its args and execs sshd in
          # the foreground — without the override this docker run never returns.
          echo "agent image built — serves plug version: $(docker run --rm --entrypoint cat softwarity/plug:e2e /opt/plug/VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-cluster-${{ inputs.corr }}
      - name: Serve the cluster (idle until cancelled)
        env:
          PLUG_CLUSTER_TTL: "1200" # backstop only — kill-cluster cancels this run when the e2e jobs finish
          # The cluster's identity, served by the `ident` service — the multicluster
          # e2e asserts that the SAME name reaches the RIGHT cluster through each plug.
          PLUG_CLUSTER_IDENT: ${{ inputs.corr }}
        run: bash scripts/ci/cluster-serve.sh
