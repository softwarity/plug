name: e2e-mesh

# Cross-OS e2e that native-Linux Docker can't give us: run plug NATIVELY on a
# macOS/Windows runner against a REAL cluster, reaching services BY NAME. The
# cluster can't run as Linux containers on a mac/win runner, so it runs on its
# own Linux run (cluster.yml) and the client connects over a Tailscale mesh.
#
# Flow:  start-cluster (dispatches cluster.yml, keeps its run id)
#          └─ e2e-mac (joins the mesh, asserts httpbin reachable by name)
#             └─ kill-cluster (cancels the cluster run — always)
#
# Dispatch-only until the Tailscale secrets exist and it's proven; then add a
# push/schedule trigger. Needs repo secrets TAILSCALE_CLIENT_ID / TAILSCALE_CLIENT_SECRET.
on:
  workflow_dispatch:

permissions:
  actions: write # dispatch + cancel the cluster run
  contents: read

jobs:
  start-cluster:
    name: start cluster
    runs-on: ubuntu-latest
    outputs:
      cluster_id: ${{ steps.dispatch.outputs.id }}
    steps:
      - uses: actions/checkout@v6
      - id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(bash scripts/ci/dispatch-cluster.sh ${{ github.run_id }})" >> "$GITHUB_OUTPUT"

  e2e-mac:
    name: e2e (macOS, by name over the mesh)
    needs: start-cluster
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-mac-${{ github.run_id }}
          # We reach the cluster by tailnet IP (`tailscale ip`), so we don't need
          # Tailscale's MagicDNS — and letting it repoint the macOS system resolver
          # would fight plug's own DNS override (curl: could not resolve host).
          args: --accept-dns=false
      - name: Protocol matrix by name (native, over the mesh)
        run: bash scripts/ci/e2e-matrix.sh plug-cluster-${{ github.run_id }} 2222

  e2e-win:
    name: e2e (Windows, by name over the mesh)
    needs: start-cluster
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          hostname: plug-win-${{ github.run_id }}
          args: --accept-dns=false # reach the cluster by tailnet IP; don't let Tailscale drive DNS
      - name: Protocol matrix by name (native, over the mesh)
        shell: bash
        run: bash scripts/ci/e2e-matrix.sh plug-cluster-${{ github.run_id }} 2222

  kill-cluster:
    name: kill cluster
    needs: [start-cluster, e2e-mac, e2e-win]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ needs.start-cluster.outputs.cluster_id }} || true
