# plug agent — two ways to deploy.
#
# RECOMMENDED: add the service below to YOUR application stack. It joins the
# stack's network automatically — nothing else to declare:
#
#   services:
#     plug:
#       image: docker.io/softwarity/plug:latest
#       ports:
#         - "2222:22"
#
# STANDALONE (this file): one agent covering several stacks at once — list
# their overlay networks explicitly, then:
#   docker stack deploy -c plug-stack.yml plug
services:
  plug:
    image: docker.io/softwarity/plug:latest
    ports:
      - "2222:22"
    volumes:
      # Optional — only to serve a local port back to the cluster (plug -s).
      # On Swarm the signpost is a service, so the agent must run on a manager.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_net
    deploy:
      # One task is all a dev agent needs, and it is not a constraint any more: a
      # signpost relays to the TASK holding the session (<service>.<slot>.<id>,
      # which the overlay's DNS answers), not to the service VIP that would spread
      # a session's requests across every replica. Scale it if you want to.
      replicas: 1
      placement:
        constraints: [node.role == manager]   # so it can create signpost services (plug -s)

networks:
  app_net:
    external: true
