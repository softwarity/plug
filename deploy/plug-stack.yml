# plug agent — two ways to deploy.
#
# RECOMMENDED: add the service below to YOUR application stack. It joins the
# stack's network automatically — nothing else to declare:
#
#   services:
#     plug:
#       image: docker.io/softwarity/plug:latest
#       ports:
#         - "2222:22"
#
# STANDALONE (this file): one agent covering several stacks at once — list
# their overlay networks explicitly, then:
#   docker stack deploy -c plug-stack.yml plug
services:
  plug:
    image: docker.io/softwarity/plug:latest
    ports:
      - "2222:22"
    volumes:
      # The Docker socket, mounted by default. It is what the reverse direction
      # needs (plug -s: the agent creates signpost services and parks a deployed
      # service by scaling it to zero and back) and what env-of, files-of and
      # --mount read a workload's environment, secrets and volumes through. On
      # Swarm the signpost is a service, so the agent must run on a MANAGER
      # (the placement below), and the socket of a manager is root on the whole
      # Swarm: whoever reaches the agent's port (every plug binary carries the
      # tunnel key) can create any service, with any mount, on any node, and
      # read any secret a running task has. Trusted dev clusters only. Remove
      # the mount to keep plug to the forward direction (plug <cmd>), which
      # needs none of it.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_net
    deploy:
      # One task is all a dev agent needs, and it is not a constraint any more: a
      # signpost relays to the TASK holding the session (<service>.<slot>.<id>,
      # which the overlay's DNS answers), not to the service VIP that would spread
      # a session's requests across every replica. Scale it if you want to.
      replicas: 1
      placement:
        constraints: [node.role == manager]   # so it can create signpost services (plug -s)

networks:
  app_net:
    external: true
