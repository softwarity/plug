# plug agent for Kubernetes.
#
#   kubectl -n <your-namespace> apply -f plug-k8s.yaml
#
# One file, one command — the agent AND the reverse direction's dynamic name
# provisioning (plug -s). Deploy it in the SAME namespace as the services you
# want to reach: the agent's sshd resolves short names (myservice) via the pod's
# resolver (CoreDNS) from inside that namespace and opens the connection itself,
# over an SSH direct-tcpip channel. No subnet, no CIDR — resolution happens by
# name, in-cluster. Cross-namespace? Use the FQDN in your code
# (myservice.othernamespace, or myservice.othernamespace.svc.cluster.local).
#
# How the data path works (for context): the `plug` CLI captures the child
# process's cluster traffic at the IP layer with a userspace TUN (gVisor
# netstack), then splices each flow — by name — through a single SSH tunnel to
# this agent. sshd here does the actual name resolution and dialing from inside
# the cluster. There is no SOCKS proxy and no server-side code of ours: just
# stock openssh forwarding. Trusted dev clusters only — the transport has no
# authentication by design (see the repo's security model).
#
# The reverse direction (plug -s <name>:<cport>:<lport>) has the agent CREATE
# and DELETE a Service pointing that name at itself, per session — no name
# pre-declared, no redeploy. That is what the ServiceAccount + Role + RoleBinding
# below grant: DELIBERATELY MINIMAL and namespace-scoped — manage Services, and
# nothing else. The agent can make a name in ITS namespace point at itself; it
# cannot touch pods, secrets, other namespaces, or the cluster. A name served
# this way is a port on the agent, reachable by whatever can reach the agent —
# consistent with plug's trusted-dev-cluster model. Deploy accordingly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plug
  labels: { app: plug }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plug
  labels: { app: plug }
spec:
  replicas: 1
  selector:
    matchLabels: { app: plug }
  template:
    metadata:
      labels: { app: plug }
    spec:
      serviceAccountName: plug
      # sshd must start as root: it writes host keys at boot (ssh-keygen -A),
      # binds the privileged port 22, and privilege-separates by forking to the
      # unprivileged `plug`/`get` users per session. So we do NOT force
      # runAsNonRoot or a read-only rootfs here (either breaks sshd); we keep the
      # one hardening that is safe for sshd — the default seccomp profile.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plug
          image: docker.io/softwarity/plug:latest
          imagePullPolicy: Always # image is a moving `latest` (rebuilt in place)
          ports:
            - name: ssh
              containerPort: 22
          # sshd is up as soon as it accepts TCP on 22; a plain TCP probe avoids
          # needing credentials.
          readinessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Modest footprint: the agent only shuttles bytes over ssh.
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plug
  labels: { app: plug }
spec:
  type: NodePort
  selector: { app: plug }
  ports:
    - name: ssh
      port: 2222
      targetPort: 22
      nodePort: 32222
---
# The reverse direction's grant: Services only, this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plug-serve-names
  labels: { app: plug }
rules:
  # Exactly what serve-name / unserve-name / boot-gc need — Services only.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plug-serve-names
  labels: { app: plug }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plug-serve-names
subjects:
  - kind: ServiceAccount
    name: plug
# Reach the agent two ways:
#   • NodePort:  plug --host <a-node> --port 32222 <cmd>
#   • No exposed port — kubectl port-forward (gated by the API-server RBAC),
#     then plug on localhost:
#       kubectl -n <ns> port-forward svc/plug 2222:2222
#       plug --host localhost <cmd>
