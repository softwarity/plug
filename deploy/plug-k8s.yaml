# plug agent for Kubernetes.
#
#   kubectl -n <your-namespace> apply -f plug-k8s.yaml
#
# Deploy it in the SAME namespace as the services you want to reach: the agent's
# sshd resolves short names (myservice) via CoreDNS from inside that namespace,
# and dials them for you. No subnet, no CIDR — the SOCKS proxy works by name.
# Cross-namespace? Use the FQDN in your code (myservice.othernamespace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plug
  labels: { app: plug }
spec:
  replicas: 1
  selector:
    matchLabels: { app: plug }
  template:
    metadata:
      labels: { app: plug }
    spec:
      containers:
        - name: plug
          image: docker.io/softwarity/plug:latest
          ports:
            - containerPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: plug
spec:
  type: NodePort
  selector: { app: plug }
  ports:
    - port: 2222
      targetPort: 22
      nodePort: 32222
# Reach it two ways:
#   • NodePort:  plug --host <a-node> --port 32222 <cmd>
#   • No exposed port — kubectl port-forward (RBAC-gated), then plug on localhost:
#       kubectl -n <ns> port-forward svc/plug 2222:2222
#       plug --host localhost <cmd>
