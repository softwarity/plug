# plug agent for Kubernetes.
#
#   kubectl -n <your-namespace> apply -f plug-k8s.yaml
#
# One file, one command - the agent AND the reverse direction's dynamic name
# provisioning (plug -s). Deploy it in the SAME namespace as the services you
# want to reach: the agent resolves short names (myservice) via the pod's
# resolver (CoreDNS) from inside that namespace and opens the connection itself,
# over an SSH direct-tcpip channel. No subnet, no CIDR - resolution happens by
# name, in-cluster. Cross-namespace? Use the FQDN in your code
# (myservice.othernamespace, or myservice.othernamespace.svc.cluster.local).
#
# How the data path works (for context): the `plug` CLI captures the child
# process's cluster traffic at the IP layer with a userspace TUN (gVisor
# netstack), then splices each flow - by name - through a single SSH tunnel to
# this agent, which does the actual name resolution and dialing from inside the
# cluster. There is no SOCKS proxy: the agent is a small SSH server (a few
# hundred lines over golang.org/x/crypto/ssh) whose entire exposed surface is
# two accounts, one fixed command each, and the two forwarding primitives - no
# shell, no setuid binary, no sshd configuration. Trusted dev clusters only:
# the transport authenticates the software, not a person, by design (see the
# repo's security model).
#
# The reverse direction (plug -s <name>:<cport>:<lport>) has the agent CREATE
# and DELETE a Service pointing that name at itself, per session - no name
# pre-declared, no redeploy. That is the core of what the ServiceAccount + Role
# + RoleBinding below grant, and it is NOT all of it. The Role is scoped to this
# namespace and to nothing narrower; rule by rule, it lets the agent:
#
#   services (get/list/create/delete/update/patch): create, remove and REPOINT
#     any Service of the namespace. A takeover (plug -s on a deployed name)
#     sends a real Service's traffic to one developer's machine for a session.
#   endpoints (get/create/update/delete): write the addresses behind any
#     Service of the namespace, i.e. decide where it delivers.
#   endpointslices (list/deletecollection): remove the slices Kubernetes built
#     for a taken-over Service (see the rule).
#   deployments (get/list/patch): patch ANY Deployment of the namespace. The
#     agent uses it on its own, found by the app=plug label (`plug update`).
#   pods (get/list/create/delete) and pods/exec (get/create): list the pods,
#     run a command in ANY of them, create pods carrying any ServiceAccount or
#     mounting any Secret of the namespace, and delete pods. This is the right
#     to execute code in the namespace. It reads every Secret and ConfigMap a
#     pod has already resolved - env-of and files-of do exactly that, with no
#     `secrets` rule needed - and the live mount (--mount) is the created pod:
#     the agent's image with a workload's claim, served read-write over SMB.
#   persistentvolumeclaims (get): read a claim's access modes.
#
# So this Role does touch pods, and through them the secrets; what it cannot
# reach is other namespaces and the cluster. The trust boundary is not the
# RBAC, it is whoever can reach the agent's PORT: the tunnel's key is the
# built-in one that every plug binary carries, and the binary itself is served
# without authentication by the `get` account on that same port, so reaching
# the port is holding the key and every verb above. The Service below is a
# NodePort (32222 on every node) because that is the zero-setup way to reach a
# dev cluster from a workstation. If the port must not be exposed, do not
# expose it: `kubectl port-forward` (at the end of this file) reaches the agent
# through the API server's own authentication and needs no NodePort, and the
# Service type is then yours to change. Deploy this only in a namespace whose
# pods you would let every holder of the port exec into.
#
# Why Endpoints and not just a selector: a served name must reach the ONE pod
# holding that session, and a selector cannot say that. `app: plug` matches every
# replica of the agent, so with more than one the name works for one request in N
# and the rest land on a pod that never heard of the session. So the Service plug
# creates carries NO selector and the agent writes its Endpoints itself, with the
# address the downward API gives it below. The alternative - have each agent label
# its own pod and select that - would need `pods: patch`, i.e. the right to
# rewrite pods in the namespace, which is a far larger grant than writing the
# endpoints of the names plug itself created.
#
# EndpointSlices: the mirroring controller built into Kubernetes derives plug's
# from the Endpoints it writes, which is what kube-proxy routes on - no right
# needed for a name plug CREATES. A name TAKEN OVER is different: see the
# endpointslices rule in the Role below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plug
  labels: { app: plug }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plug
  labels: { app: plug }
spec:
  replicas: 1
  selector:
    matchLabels: { app: plug }
  template:
    metadata:
      labels: { app: plug }
    spec:
      serviceAccountName: plug
      # The agent starts as root for two reasons: it binds the privileged port 22,
      # and it reaches the service-account token (the docker socket, on Swarm).
      # It no longer forks to unprivileged users per session - there are no Unix
      # accounts in the image at all, and no setuid binary - so we do NOT force
      # runAsNonRoot or a read-only rootfs here; we keep the one hardening that
      # is safe: the default seccomp profile.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plug
          image: docker.io/softwarity/plug:latest
          imagePullPolicy: Always # image is a moving `latest` (rebuilt in place)
          ports:
            - name: ssh
              containerPort: 22
          env:
            # The address a served name is pointed at: THIS pod, not the agent's
            # deployment. The agent can work it out on its own (the source address
            # the kernel would use to reach the API server), and does when it is
            # linked into a gateway whose manifest is not this one - but a pod
            # that is told cannot be wrong.
            - name: PLUG_POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          # The agent is up as soon as it accepts TCP on 22; a plain TCP probe
          # avoids needing credentials.
          readinessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Modest footprint: the agent only shuttles bytes over ssh.
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plug
  labels: { app: plug }
spec:
  type: NodePort
  selector: { app: plug }
  ports:
    - name: ssh
      port: 2222
      targetPort: 22
      nodePort: 32222
---
# The agent's grant: this namespace only, and more than Services - each rule
# says what it reaches, the header above says what that adds up to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plug-serve-names
  labels: { app: plug }
rules:
  # What serve-name / unserve-name / the sweep need, on ANY Service of the
  # namespace: a rule cannot be narrowed to the Services plug creates, since a
  # takeover edits a Service it did not create.
  # update/patch: the takeover repoints an existing Service at the agent for
  # the session (original selector/ports saved in an annotation, restored).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "update", "patch"]
  # The name points at ONE pod, and this is how it says which: the Service plug
  # creates has no selector, so its Endpoints are the agent's to write (see the
  # header). The rule reaches the Endpoints of every Service in the namespace,
  # which is where any of them delivers. `get` is only the boot-time check that
  # this grant is present - an agent without it still serves names, the old
  # way, and says so in its log.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "create", "update", "delete"]
  # A taken-over Service keeps the EndpointSlice Kubernetes built for its pod
  # while it had a selector: the controller stops touching a selector-less
  # Service and never removes it, and kube-proxy routes over every slice, so
  # half the requests still reached the deployed pod (2.12.0 to 2.20.0). The
  # agent deletes that slice at park; the selector's return at restore makes
  # the controller build it again. `list` is doctor's view of what is doubled.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "deletecollection"]
  # `plug update`: the agent rolls and retags its OWN Deployment (a template
  # patch: the restart annotation, and the image when the tag moves). It finds
  # it by the app=plug label, but the rule has no resourceNames, so `patch`
  # reaches every Deployment of the namespace. Narrow it with
  # `resourceNames: ["plug"]` if the Deployment keeps that name.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # The process that takes a deployed service's place inherits that service's
  # environment, read with `exec cat /proc/1/environ` in the parked pod - the
  # same mechanism as mirrord. The pod has already resolved its Secrets, so no
  # `secrets` rule is asked for, and none is needed: exec reads what the pod
  # resolved, which is every Secret and ConfigMap any pod of the namespace
  # mounts or references. `pods` finds the pod behind the parked Service's
  # original selector; `pods/exec` reads it. Without exec the agent falls back
  # to the pod SPEC and says which variables came through empty.
  # exec is the widest right here: it is the right to run code in every pod of
  # the namespace, and it is what makes the feature true to the cluster.
  # create/delete: the live mount (--mount) starts a HELPER POD beside the
  # workload - the agent's own image, with the workload's PersistentVolumeClaim
  # mounted, serving it over SMB for the session - and removes it when the
  # session ends (or the sweep does, when the session died). Pinned to the
  # workload's node, so a ReadWriteOnce claim is shared the way the mode allows.
  # `create` is as wide as exec by another road: a created pod may name any
  # ServiceAccount and mount any Secret of the namespace; `delete` reaches any
  # pod, not only the helpers.
  # `persistentvolumeclaims` get: to refuse a ReadWriteOncePod claim with a
  # reason instead of a helper that stays Pending.
  # On OpenShift and OKD the helper pod is created in the shape the restricted
  # SCC admits (no root, no capability, a high port behind its Service); the
  # agent tells the platform apart by API discovery, which every
  # ServiceAccount may read, so nothing is granted for it here.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  # Both verbs, as Kubernetes' own `edit` role grants them: the API server
  # evaluates a WebSocket upgrade (a GET) as `get` and a SPDY exec (a POST) as
  # `create`. `create` alone was tried and answered 403 on a real cluster.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plug-serve-names
  labels: { app: plug }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plug-serve-names
subjects:
  - kind: ServiceAccount
    name: plug
# Reach the agent two ways:
#   • NodePort:  plug --host <a-node> --port 32222 <cmd>
#   • No exposed port - kubectl port-forward (gated by the API-server RBAC),
#     then plug on localhost:
#       kubectl -n <ns> port-forward svc/plug 2222:2222
#       plug --host localhost <cmd>
