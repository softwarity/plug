# Overlay for the CI "mesh cluster" (scripts/ci/cluster-serve.sh):
#   docker compose -f compose.yml -f compose.cluster.yml up -d agent httpbin
#
# The normal e2e keeps clients IN the compose network, so the agent needs no
# published port. Here the client lives on a *different runner* and reaches the
# agent over the tailnet, so we publish its SSH port on the host — the runner's
# tailnet IP:2222 then lands on the agent. Services stay internal-only.
services:
  agent:
    ports:
      - "2222:22"
    # The docker.sock is REQUIRED for -s: with it, a session's -s provisions its
    # cluster name DYNAMICALLY (the agent spawns a signpost container carrying the
    # DNS alias — no pre-declared aliases, no stack redeploy). The expose e2e cell
    # exercises exactly that: the exposed-<os> names exist nowhere in these files.
    # Without the sock the agent falls back to "static" (pre-declared aliases).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Answers this cluster's identity (PLUG_CLUSTER_IDENT, its corr id) on :5678.
  # The multicluster e2e reaches http://ident:5678 through TWO plugs at once and
  # asserts each one lands on its OWN cluster — same name, right backend.
  ident:
    image: hashicorp/http-echo
    command: ["-listen=:5678", "-text=${PLUG_CLUSTER_IDENT:-solo}"]
    networks: [internal]

  # In-cluster fetcher: GET prober:8097/fetch?url=… does the GET from inside the
  # cluster — the expose e2e's witness that a runner-served name really answers.
  prober:
    build: { context: ., dockerfile: services/prober/Dockerfile }
    networks: [internal]

  # API-gateway simulator for the reverse direction. Its port is PUBLISHED on the
  # host (like the agent's), so the e2e runner POSTs to it DIRECTLY over the
  # tailnet — not through plug. On POST {service,port,id} it makes the in-cluster
  # call to <service>:<port>?id=<id>, which lands on the runner's `plug -s` sink,
  # and returns the answer. Proves the downward path end to end, from outside.
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports:
      - "18090:8100"
    networks: [internal]

  # Outage simulators: <name>:8099 listens ONLY after GET <name>:8098/up — the
  # e2e reproduces "service down, then it comes back" inside one live plug
  # session, flipping the switch itself through plug. ONE INSTANCE PER OS LEG:
  # all three legs share this cluster, and the first one to run its outage test
  # would otherwise leave the switch ON for the others (same image, built once).
  flaky-linux:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]
  flaky-mac:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]
  flaky-win:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]

  # Takeover targets: REAL deployed services the takeover e2e parks (container
  # stopped for the session) and expects back afterwards. ONE PER OS LEG — the
  # legs share this cluster, and parking a shared service (httpbin…) would break
  # the other legs mid-run. Same echo image as ident: distinctive fixed answer.
  # One cluster PORT per leg too (8085/8086/8087): the -s remote-forward binds
  # that port on the AGENT, globally — two legs on the same port would collide
  # (sshd denies the second tcpip-forward) since the legs run concurrently.
  tko-linux:
    image: hashicorp/http-echo
    command: ["-listen=:8085", "-text=deployed-tko-linux"]
    networks: [internal]
  tko-mac:
    image: hashicorp/http-echo
    command: ["-listen=:8086", "-text=deployed-tko-mac"]
    networks: [internal]
  tko-win:
    image: hashicorp/http-echo
    command: ["-listen=:8087", "-text=deployed-tko-win"]
    networks: [internal]

  # Agent-crash simulator: GET chaos:8095/restart-agent?svc=<service> restarts
  # that compose service's container (docker.sock, by label) — the resilience
  # cell's trigger. It answers BEFORE firing: the caller reaches it through the
  # very cluster whose agent is about to die.
  chaos:
    build: { context: ., dockerfile: services/chaos/Dockerfile }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

  # Per-leg CRASH-TEST agents: the resilience cell restarts an agent
  # mid-session, and the three legs run CONCURRENTLY — crashing the shared
  # agent interleaved three ways tore the sessions' teardowns apart (the legs
  # aligned once and all three restores lost their agent). Each leg crashes its
  # OWN dedicated agent; the main agent (and the prober behind it) never
  # reboots. Same image, sock mounted (the signpost/park needs it).
  res-agent-linux:
    image: softwarity/plug:e2e
    ports:
      - "2223:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
  res-agent-mac:
    image: softwarity/plug:e2e
    ports:
      - "2224:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
  res-agent-win:
    image: softwarity/plug:e2e
    ports:
      - "2225:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

  # Per-leg agents on the PREVIOUS published release, for the update cells. It is
  # is the oldest agent that can retarget itself (registry.go landed there), so
  # it is the only meaningful starting point: `plug update` against it must reach
  # the newest release on the registry, and `plug update <tag>` against it must
  # be REFUSED — it predates the verb's target argument. Pinned on purpose; this
  # is a historical fact, not a version to keep current.
  prev-agent-linux:
    image: softwarity/plug:${PREV_RELEASE:?}
    ports:
      - "2226:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
  prev-agent-mac:
    image: softwarity/plug:${PREV_RELEASE:?}
    ports:
      - "2227:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
  prev-agent-win:
    image: softwarity/plug:${PREV_RELEASE:?}
    ports:
      - "2228:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

  # Resilience takeover targets — one per OS leg, one port per leg (same
  # reasons as tko-*): the resilience cell parks these, RESTARTS THE AGENT
  # mid-session, and asserts the park comes back (boot-gc restores, the
  # reconnect re-parks) before the final restore.
  res-tko-linux:
    image: hashicorp/http-echo
    command: ["-listen=:8115", "-text=deployed-res-linux"]
    networks: [internal]
  res-tko-mac:
    image: hashicorp/http-echo
    command: ["-listen=:8116", "-text=deployed-res-mac"]
    networks: [internal]
  res-tko-win:
    image: hashicorp/http-echo
    command: ["-listen=:8117", "-text=deployed-res-win"]
    networks: [internal]
