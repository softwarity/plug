# Overlay for the CI "mesh cluster" (scripts/ci/cluster-serve.sh):
#   docker compose -f compose.yml -f compose.cluster.yml up -d agent httpbin
#
# The normal e2e keeps clients IN the compose network, so the agent needs no
# published port. Here the client lives on a *different runner* and reaches the
# agent over the tailnet, so we publish its SSH port on the host — the runner's
# tailnet IP:2222 then lands on the agent. Services stay internal-only.
services:
  agent:
    ports:
      - "2222:22"

  # Answers this cluster's identity (PLUG_CLUSTER_IDENT, its corr id) on :5678.
  # The multicluster e2e reaches http://ident:5678 through TWO plugs at once and
  # asserts each one lands on its OWN cluster — same name, right backend.
  ident:
    image: hashicorp/http-echo
    command: ["-listen=:5678", "-text=${PLUG_CLUSTER_IDENT:-solo}"]
    networks: [internal]

  # Outage simulator: flaky:8099 listens ONLY after GET flaky:8098/up — the e2e
  # reproduces "service down, then it comes back" inside one live plug session,
  # flipping the switch itself through plug (no cross-job orchestration needed).
  flaky:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]
