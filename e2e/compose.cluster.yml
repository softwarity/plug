# Overlay for the CI "mesh cluster" (scripts/ci/cluster-serve.sh):
#   docker compose -f compose.yml -f compose.cluster.yml up -d agent httpbin
#
# The normal e2e keeps clients IN the compose network, so the agent needs no
# published port. Here the client lives on a *different runner* and reaches the
# agent over the tailnet, so we publish its SSH port on the host — the runner's
# tailnet IP:2222 then lands on the agent. Services stay internal-only.
services:
  agent:
    ports:
      - "2222:22"
    # The docker.sock is REQUIRED for -s: with it, a session's -s provisions its
    # cluster name DYNAMICALLY (the agent spawns a signpost container carrying the
    # DNS alias — no pre-declared aliases, no stack redeploy). The expose e2e cell
    # exercises exactly that: the exposed-<os> names exist nowhere in these files.
    # Without the sock the agent falls back to "static" (pre-declared aliases).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Answers this cluster's identity (PLUG_CLUSTER_IDENT, its corr id) on :5678.
  # The multicluster e2e reaches http://ident:5678 through TWO plugs at once and
  # asserts each one lands on its OWN cluster — same name, right backend.
  ident:
    image: hashicorp/http-echo
    command: ["-listen=:5678", "-text=${PLUG_CLUSTER_IDENT:-solo}"]
    networks: [internal]

  # In-cluster fetcher: GET prober:8097/fetch?url=… does the GET from inside the
  # cluster — the expose e2e's witness that a runner-served name really answers.
  prober:
    build: { context: ., dockerfile: services/prober/Dockerfile }
    networks: [internal]

  # API-gateway simulator for the reverse direction. Its port is PUBLISHED on the
  # host (like the agent's), so the e2e runner POSTs to it DIRECTLY over the
  # tailnet — not through plug. On POST {service,port,id} it makes the in-cluster
  # call to <service>:<port>?id=<id>, which lands on the runner's `plug -s` sink,
  # and returns the answer. Proves the downward path end to end, from outside.
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports:
      - "18090:8100"
    networks: [internal]

  # Outage simulators: <name>:8099 listens ONLY after GET <name>:8098/up — the
  # e2e reproduces "service down, then it comes back" inside one live plug
  # session, flipping the switch itself through plug. ONE INSTANCE PER OS LEG:
  # all three legs share this cluster, and the first one to run its outage test
  # would otherwise leave the switch ON for the others (same image, built once).
  flaky-linux:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]
  flaky-mac:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]
  flaky-win:
    build: { context: ., dockerfile: services/flaky/Dockerfile }
    networks: [internal]

  # Takeover targets: REAL deployed services the takeover e2e parks (container
  # stopped for the session) and expects back afterwards. ONE PER OS LEG — the
  # legs share this cluster, and parking a shared service (httpbin…) would break
  # the other legs mid-run. Same echo image as ident: distinctive fixed answer.
  tko-linux:
    image: hashicorp/http-echo
    command: ["-listen=:8085", "-text=deployed-tko-linux"]
    networks: [internal]
  tko-mac:
    image: hashicorp/http-echo
    command: ["-listen=:8085", "-text=deployed-tko-mac"]
    networks: [internal]
  tko-win:
    image: hashicorp/http-echo
    command: ["-listen=:8085", "-text=deployed-tko-win"]
    networks: [internal]
