# Mini-cluster: the client (edge) sees the agent but NOT web (internal), so only
# plug can make `web` reachable by name.
services:
  agent:
    image: softwarity/plug:e2e
    networks: [edge, internal]

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    networks: [internal]

  client:
    build:
      context: .
      dockerfile: client.Dockerfile
    depends_on: [agent, web]
    networks: [edge]
    # The seccomp supervisor (Go coverage) needs, INSIDE a container only, to
    # install a seccomp user-notifier and process_vm_readv its child. Docker's
    # default sandbox blocks both. On a real host neither is required — this is a
    # Docker concession so the e2e can exercise the Go path.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

networks:
  edge:
  internal:
