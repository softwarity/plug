---
# Takeover targets: REAL deployed Services the takeover e2e reparks. One per OS
# leg, one cluster PORT per leg (concurrent legs, shared agent — see
# compose.cluster.yml). On k8s the park REPOINTS the Service selector at the
# agent (pods keep running) and the restore puts the original selector back —
# this is the runtime proof of the k8s takeover path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tko-linux
  labels: { app: tko-linux }
spec:
  replicas: 1
  selector: { matchLabels: { app: tko-linux } }
  template:
    metadata: { labels: { app: tko-linux } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo
          args: ["-listen=:8085", "-text=deployed-tko-linux"]
          ports: [{ containerPort: 8085 }]
---
apiVersion: v1
kind: Service
metadata: { name: tko-linux }
spec:
  selector: { app: tko-linux }
  ports: [{ port: 8085, targetPort: 8085 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tko-mac
  labels: { app: tko-mac }
spec:
  replicas: 1
