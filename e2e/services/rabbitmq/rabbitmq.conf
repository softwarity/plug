# Pre-declare the user, vhost, permissions and the `plug-e2e` queue at boot, so
# clients never declare anything at runtime. RabbitMQ 4 rejects some runtime
# declares (transient non-exclusive queues) and cross-client re-declare is
# fragile — pre-loading definitions sidesteps both. (`password_hash` for `plug`
# lives in definitions.json.)
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
