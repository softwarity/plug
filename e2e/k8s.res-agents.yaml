---
# chaos in the DEFAULT namespace, for the lease cell: that one runs against the
# MAIN agent (cluster A) and reaches chaos by name, so it has to live where the
# session's DNS resolves — beside the services, not in a per-leg namespace.
#
# Services only, deliberately: this chaos must never be able to delete a pod.
# The main agent is the witness the resilience cell measures against, the one
# that "never reboots and cannot blink" — no RBAC here can make it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos
  namespace: default
  labels: { app: chaos }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos
  namespace: default
  labels: { app: chaos }
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos
  namespace: default
  labels: { app: chaos }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos
subjects:
  - kind: ServiceAccount
    name: chaos
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos
  namespace: default
  labels: { app: chaos }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chaos }
  template:
    metadata:
      labels: { app: chaos }
    spec:
      serviceAccountName: chaos
      containers:
        - name: chaos
          image: docker.io/plug-e2e/chaos:e2e
          imagePullPolicy: Never
          ports:
            - containerPort: 8095
---
apiVersion: v1
kind: Service
metadata:
  name: chaos
  namespace: default
  labels: { app: chaos }
spec:
  selector: { app: chaos }
  ports:
    - port: 8095
      targetPort: 8095
---
# The prober lives in `default` and dials res-tko-linux by BARE NAME, like it
# does on Compose and Swarm where there is one flat namespace. Kubernetes DNS
# does not cross namespaces, so an ExternalName alias in `default` forwards the
# bare name to the real Service. The takeover repoints that real Service, and
# the alias follows it — nothing here needs to know the session happened.
apiVersion: v1
kind: Service
metadata:
  name: res-tko-linux
  namespace: default
  labels: { app: res-tko-linux }
spec:
  type: ExternalName
  externalName: res-tko-linux.plug-res-linux.svc.cluster.local
---
# chaos runs in `default` (that is where a session reaches it by name), but the
# agent it must crash lives here. Grant exactly that, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-crash
  namespace: plug-res-linux
  labels: { app: chaos }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-crash
  namespace: plug-res-linux
  labels: { app: chaos }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-crash
subjects:
  - kind: ServiceAccount
    name: chaos
    namespace: default

