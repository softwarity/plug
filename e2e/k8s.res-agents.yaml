# Per-leg CRASH-TEST agents and the deployed services they take over, for the
# resilience and lease cells on the Kubernetes family.
#
# One NAMESPACE per leg, like the previous-release agents: the three OS legs run
# CONCURRENTLY and the resilience cell crashes an agent mid-session, so a shared
# one would have the legs tearing down each other's sessions. A namespace also
# scopes chaos: it deletes pods and Services where IT is deployed, and it is
# deployed once per leg.
#
# chaos here is the same image as the other families — it detects Kubernetes by
# the env the kubelet sets, deletes the agent POD (the Deployment recreates it,
# which is what a crash looks like) and deletes the Service a session serves.
---
apiVersion: v1
kind: Namespace
metadata:
  name: plug-res-linux
  labels: { app: plug }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plug
  namespace: plug-res-linux
  labels: { app: plug }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plug
  namespace: plug-res-linux
  labels: { app: plug }
spec:
  replicas: 1
  selector:
    matchLabels: { app: plug }
  template:
    metadata:
      labels: { app: plug }
    spec:
      serviceAccountName: plug
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plug
          image: docker.io/softwarity/plug:e2e
          imagePullPolicy: Never
          ports:
            - name: ssh
              containerPort: 22
          readinessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plug
  namespace: plug-res-linux
  labels: { app: plug }
spec:
  type: NodePort
  selector: { app: plug }
  ports:
    - name: ssh
      port: 2222
      targetPort: 22
      nodePort: 32223
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plug-serve-names
  namespace: plug-res-linux
  labels: { app: plug }
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plug-serve-names
  namespace: plug-res-linux
  labels: { app: plug }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plug-serve-names
subjects:
  - kind: ServiceAccount
    name: plug
    namespace: plug-res-linux
---
# The deployed service the resilience cell parks, then must see restored.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: res-tko-linux
  namespace: plug-res-linux
  labels: { app: res-tko-linux }
spec:
  replicas: 1
  selector:
    matchLabels: { app: res-tko-linux }
  template:
    metadata:
      labels: { app: res-tko-linux }
    spec:
      containers:
        - name: echo
          image: docker.io/hashicorp/http-echo
          args: ["-listen=:8115", "-text=deployed-res-linux"]
          ports:
            - containerPort: 8115
---
apiVersion: v1
kind: Service
metadata:
  name: res-tko-linux
  namespace: plug-res-linux
  labels: { app: res-tko-linux }
spec:
  selector: { app: res-tko-linux }
  ports:
    - port: 8115
      targetPort: 8115
---
# chaos, once per leg: it acts in ITS OWN namespace, so each leg can only ever
# crash its own agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos
  namespace: plug-res-linux
  labels: { app: chaos }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos
  namespace: plug-res-linux
  labels: { app: chaos }
rules:
  # restart-agent lists then deletes the agent pod; rm-signpost deletes the
  # Service a live session serves. Nothing else, and nothing outside here.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos
  namespace: plug-res-linux
  labels: { app: chaos }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos
subjects:
  - kind: ServiceAccount
    name: chaos
    namespace: plug-res-linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos
  namespace: plug-res-linux
  labels: { app: chaos }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chaos }
  template:
    metadata:
      labels: { app: chaos }
    spec:
      serviceAccountName: chaos
      containers:
        - name: chaos
          image: docker.io/plug-e2e/chaos:e2e
          imagePullPolicy: Never
          ports:
            - containerPort: 8095
---
apiVersion: v1
kind: Service
metadata:
  name: chaos
  namespace: plug-res-linux
  labels: { app: chaos }
spec:
  selector: { app: chaos }
  ports:
    - port: 8095
      targetPort: 8095

