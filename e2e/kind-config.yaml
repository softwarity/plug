# kind config for the CI k8s mesh cluster (scripts/ci/k8s-serve.sh).
#
# The extraPortMappings publish the two NodePorts on the RUNNER's host, so the
# e2e legs keep the exact same contract as against the compose cluster:
#   <tailnet-ip>:2222  → the agent's ssh   (NodePort 32222, deploy/plug-k8s.yaml)
#   <tailnet-ip>:18090 → the gateway       (NodePort 31890, e2e/k8s.cluster.yaml)
#   <tailnet-ip>:222[678] → the per-leg previous-release agents the update cells retarget
#                          (NodePorts 3222[678], e2e/k8s.prev-agents.yaml)
# Everything else (ClusterIP Services) stays cluster-internal — only the agent
# can reach it, exactly like a real cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 32222
        hostPort: 2222
      - containerPort: 31890
        hostPort: 18090
      - containerPort: 32223
        hostPort: 2223
      - containerPort: 32224
        hostPort: 2224
      - containerPort: 32225
        hostPort: 2225
      - containerPort: 32226
        hostPort: 2226
      - containerPort: 32227
        hostPort: 2227
      - containerPort: 32228
        hostPort: 2228
