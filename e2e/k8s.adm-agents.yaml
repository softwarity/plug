# Per-leg agents that admit by approval (PLUG_ADMISSION=invite), for the
# admission cell on the Kubernetes family, with what an admitted member reaches
# through them (adm-echo, beside each agent: Kubernetes DNS does not cross
# namespaces).
#
# One NAMESPACE per leg, like the other per-leg agents: the first key to
# connect becomes the first member, and three legs racing for one agent would
# test the race. The namespace also holds the agent's own plug-members Secret.
#
# NO Secret, Role or RoleBinding for the agents here, on purpose: like the
# other fixtures, scripts/ci/k8s-serve.sh takes them from deploy/plug-k8s.yaml,
# the PUBLISHED manifest, so what this cell proves is that the file a user
# applies is enough for an agent that admits by approval: the empty Secret, and
# the Role rule that reaches it and nothing else.
#
# The chaos-crash Role lets the one chaos in `default` delete the agent's pod:
# the cell restarts the agent and asserts its members survive the new pod.
---
apiVersion: v1
kind: Namespace
metadata:
  name: plug-adm-linux
  labels: { app: plug }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plug
  namespace: plug-adm-linux
  labels: { app: plug }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plug
  namespace: plug-adm-linux
  labels: { app: plug }
spec:
  replicas: 1
  selector:
    matchLabels: { app: plug }
  template:
    metadata:
      labels: { app: plug }
    spec:
      serviceAccountName: plug
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plug
          image: docker.io/softwarity/plug:e2e
          imagePullPolicy: Never
          ports:
            - name: ssh
              containerPort: 22
          env:
            - name: PLUG_ADMISSION
              value: invite
            - name: PLUG_POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          readinessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plug
  namespace: plug-adm-linux
  labels: { app: plug }
spec:
  type: NodePort
  selector: { app: plug }
  ports:
    - name: ssh
      port: 2222
      targetPort: 22
      nodePort: 32229
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adm-echo
  namespace: plug-adm-linux
  labels: { app: adm-echo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: adm-echo }
  template:
    metadata:
      labels: { app: adm-echo }
    spec:
      containers:
        - name: echo
          image: docker.io/hashicorp/http-echo:1.0.0
          args: ["-listen=:8150", "-text=admitted"]
          ports:
            - containerPort: 8150
---
apiVersion: v1
kind: Service
metadata:
  name: adm-echo
  namespace: plug-adm-linux
  labels: { app: adm-echo }
spec:
  selector: { app: adm-echo }
  ports:
    - port: 8150
      targetPort: 8150
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-crash
  namespace: plug-adm-linux
  labels: { app: chaos }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-crash
  namespace: plug-adm-linux
  labels: { app: chaos }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-crash
subjects:
  - kind: ServiceAccount
    name: chaos
    namespace: default
---
