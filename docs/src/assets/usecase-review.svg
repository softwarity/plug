<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>A reviewer tries your branch on the test platform, served from your machine</title>
  <desc>The reviewer opens the test platform's usual address in a browser. The request enters through the platform's ingress and goes to the name web, whose deployed instance is parked: the plug agent carries it through the SSH tunnel to your machine, which sits behind its firewall, NAT or VPN. The tunnel was opened by your machine, outbound, so nothing has to route to it. When the session ends, the deployed web is back.</desc>
  <defs>
    <marker id="rv-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950" /></marker>
    <marker id="rv-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7" /></marker>
  </defs>
  <rect x="2" y="2" width="896" height="376" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- The reviewer. -->
  <rect x="24" y="110" width="150" height="110" rx="10" fill="#161b22" stroke="#30363d" />
  <rect x="36" y="122" width="126" height="18" rx="4" fill="#21262d" />
  <text x="99" y="134.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#8b949e">shop.test.example.com</text>
  <rect x="36" y="146" width="126" height="60" fill="#0d1117" stroke="#30363d" />
  <rect x="52" y="156" width="94" height="14" rx="3" fill="#3fb950" opacity="0.25" />
  <text x="99" y="166" text-anchor="middle" font-size="8" fill="#3fb950">the new feature</text>
  <rect x="52" y="178" width="60" height="6" rx="3" fill="#30363d" />
  <rect x="52" y="190" width="80" height="6" rx="3" fill="#30363d" />
  <text x="99" y="240" text-anchor="middle" font-size="11" fill="#c9d1d9">QA, or the business</text>
  <text x="99" y="256" text-anchor="middle" font-size="9.5" fill="#8b949e">knows the platform's address,</text>
  <text x="99" y="270" text-anchor="middle" font-size="9.5" fill="#8b949e">not your machine</text>

  <!-- The test platform. -->
  <rect x="212" y="40" width="380" height="290" rx="12" fill="#0e141b" stroke="#30363d" />
  <text x="234" y="66" font-size="12" letter-spacing="2" fill="#8b949e" font-weight="700">THE TEST PLATFORM</text>
  <rect x="234" y="86" width="44" height="222" rx="8" fill="#161b22" stroke="#30363d" />
  <text x="256" y="200" text-anchor="middle" font-size="12" fill="#e6edf3" font-weight="600" transform="rotate(-90 256 200)">ingress</text>

  <g opacity="0.55">
    <rect x="318" y="236" width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3" />
    <text x="378" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8b949e" font-weight="600">web</text>
    <text x="378" y="271" text-anchor="middle" font-size="8.5" fill="#6e7681">main · restored on exit</text>
  </g>
  <rect x="392" y="228" width="42" height="15" rx="7.5" fill="#0d1117" stroke="#d29922" stroke-width="0.8" />
  <text x="413" y="238.5" text-anchor="middle" font-size="8.5" fill="#d29922">parked</text>

  <rect x="460" y="112" width="110" height="96" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.4" />
  <text x="515" y="156" text-anchor="middle" font-size="13" fill="#e6edf3" font-weight="600">plug</text>
  <text x="515" y="174" text-anchor="middle" font-size="11" fill="#8b949e">agent</text>

  <path d="M174 160 H230" stroke="#3fb950" stroke-width="1.8" fill="none" marker-end="url(#rv-g)" />
  <path d="M278 156 C350 156 400 156 456 158" stroke="#3fb950" stroke-width="1.8" fill="none" marker-end="url(#rv-g)" />
  <text x="368" y="146" text-anchor="middle" font-size="9.5" fill="#3fb950">web:80, as always</text>

  <!-- The firewall, between the platform and your machine. -->
  <rect x="640" y="70" width="18" height="250" rx="3" fill="#21262d" stroke="#30363d" />
  <g stroke="#30363d" stroke-width="1">
    <path d="M640 100 H658" /><path d="M640 130 H658" /><path d="M640 220 H658" /><path d="M640 250 H658" /><path d="M640 280 H658" /><path d="M640 310 H658" />
  </g>
  <text x="649" y="350" text-anchor="middle" font-size="9.5" fill="#8b949e">your firewall, NAT, VPN</text>

  <!-- The tunnel: opened outbound by your machine, through the wall. -->
  <rect x="570" y="144" width="130" height="34" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1.1" stroke-dasharray="6 4" />
  <path d="M574 155 H696" stroke="#3fb950" stroke-width="1.8" fill="none" marker-end="url(#rv-g)" />
  <path d="M696 170 H576" stroke="#a371f7" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#rv-p)" />
  <text x="634" y="200" text-anchor="middle" font-size="9" fill="#a371f7">opened by your machine,</text>
  <text x="634" y="212" text-anchor="middle" font-size="9" fill="#a371f7">outbound</text>

  <!-- Your machine. -->
  <rect x="700" y="86" width="176" height="200" rx="12" fill="#161b22" stroke="#30363d" />
  <text x="716" y="108" font-size="11" letter-spacing="1.5" fill="#8b949e" font-weight="700">YOUR MACHINE</text>
  <rect x="716" y="122" width="144" height="88" rx="8" fill="#21262d" stroke="#30363d" />
  <text x="788" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#e6edf3" font-weight="600">web</text>
  <text x="788" y="172" text-anchor="middle" font-size="10" fill="#8b949e">your branch, npm start</text>
  <text x="788" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3fb950">plug -s web:80:4200</text>
  <text x="788" y="236" text-anchor="middle" font-size="10" fill="#c9d1d9">a remark? fix, save:</text>
  <text x="788" y="252" text-anchor="middle" font-size="10" fill="#c9d1d9">the next reload has it</text>
</svg>
