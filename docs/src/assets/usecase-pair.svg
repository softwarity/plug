<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>Two developers on one feature, meeting in the cluster</title>
  <desc>Alice runs the front end on her machine and Bob the back end on his, each under plug, each tunnel opened outbound to the dev cluster. Bob serves the name api from his branch; the deployed api is parked. Alice's dev server calls api:8080 as it would in the cluster: the agent carries the call to Bob's machine. Bob's api reaches the cluster's database as if it ran there.</desc>
  <defs>
    <marker id="pr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950" /></marker>
    <marker id="pr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff" /></marker>
  </defs>
  <rect x="2" y="2" width="896" height="356" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Alice's machine. -->
  <rect x="24" y="80" width="190" height="200" rx="12" fill="#161b22" stroke="#30363d" />
  <text x="40" y="102" font-size="11" letter-spacing="1.5" fill="#8b949e" font-weight="700">ALICE · FRONT END</text>
  <rect x="40" y="116" width="158" height="92" rx="8" fill="#21262d" stroke="#30363d" />
  <text x="119" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#e6edf3" font-weight="600">web</text>
  <text x="119" y="163" text-anchor="middle" font-size="10" fill="#8b949e">her branch, npm start</text>
  <text x="119" y="181" text-anchor="middle" font-size="9.5" fill="#8b949e">proxies /api to api:8080</text>
  <text x="119" y="198" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a371f7">plug -s web:80:4200</text>
  <text x="119" y="232" text-anchor="middle" font-size="10" fill="#c9d1d9">"I need GET /orders/:id/lines"</text>
  <text x="119" y="252" text-anchor="middle" font-size="9.5" fill="#8b949e">and calls it as soon as it exists</text>

  <!-- The dev cluster. -->
  <rect x="268" y="40" width="364" height="290" rx="12" fill="#0e141b" stroke="#30363d" />
  <text x="290" y="66" font-size="12" letter-spacing="2" fill="#8b949e" font-weight="700">THE DEV CLUSTER</text>

  <rect x="395" y="96" width="110" height="80" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.4" />
  <text x="450" y="132" text-anchor="middle" font-size="13" fill="#e6edf3" font-weight="600">plug</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#8b949e">agent</text>

  <g opacity="0.55">
    <rect x="300" y="236" width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3" />
    <text x="360" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8b949e" font-weight="600">api</text>
    <text x="360" y="271" text-anchor="middle" font-size="8.5" fill="#6e7681">main · restored on exit</text>
  </g>
  <rect x="374" y="228" width="42" height="15" rx="7.5" fill="#0d1117" stroke="#d29922" stroke-width="0.8" />
  <text x="395" y="238.5" text-anchor="middle" font-size="8.5" fill="#d29922">parked</text>

  <rect x="480" y="236" width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" />
  <text x="540" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e6edf3" font-weight="600">db</text>
  <text x="540" y="271" text-anchor="middle" font-size="8.5" fill="#8b949e">the cluster's data</text>

  <!-- Alice's call to api:8080, through her tunnel, the agent, then Bob's tunnel. -->
  <path d="M214 140 H391" stroke="#58a6ff" stroke-width="1.8" fill="none" marker-end="url(#pr-b)" />
  <text x="302" y="130" text-anchor="middle" font-size="9.5" fill="#58a6ff">api:8080, as in the cluster</text>
  <path d="M505 140 H682" stroke="#3fb950" stroke-width="1.8" fill="none" marker-end="url(#pr-g)" />
  <text x="594" y="130" text-anchor="middle" font-size="9.5" fill="#3fb950">served by Bob's branch</text>

  <!-- Bob's api reaching the database. -->
  <path d="M686 236 C640 236 620 258 604 258" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#pr-b)" />
  <text x="660" y="226" text-anchor="middle" font-size="9" fill="#58a6ff">db:5432</text>

  <text x="450" y="206" text-anchor="middle" font-size="9" fill="#a371f7">both tunnels opened outbound</text>
  <text x="450" y="218" text-anchor="middle" font-size="9" fill="#a371f7">by the two machines</text>

  <!-- Bob's machine. -->
  <rect x="686" y="80" width="190" height="200" rx="12" fill="#161b22" stroke="#30363d" />
  <text x="702" y="102" font-size="11" letter-spacing="1.5" fill="#8b949e" font-weight="700">BOB · BACK END</text>
  <rect x="702" y="116" width="158" height="92" rx="8" fill="#21262d" stroke="#30363d" />
  <text x="781" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#e6edf3" font-weight="600">api</text>
  <text x="781" y="163" text-anchor="middle" font-size="10" fill="#8b949e">his branch, watch mode</text>
  <text x="781" y="181" text-anchor="middle" font-size="9.5" fill="#8b949e">adds the endpoint, saves</text>
  <text x="781" y="198" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a371f7">plug -s api:8080:3000</text>
  <text x="781" y="232" text-anchor="middle" font-size="10" fill="#c9d1d9">the next call from Alice</text>
  <text x="781" y="252" text-anchor="middle" font-size="9.5" fill="#8b949e">reaches the new code</text>
</svg>
