<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="511" viewBox="0 0 900 511" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>plug: your process reads and writes the workload's volume, live</title>
  <desc>Animated walk in two rounds. Round one, the cluster alone: the storage lives outside the cluster and reaches into it through a claim, a PVC or a volume, drawn as a permanent connector on the cluster's border; the deployed service api mounts that claim and reads and writes through it. Then the plug command lights up on your machine and the session starts: the deployed api is parked, a plug helper appears beside the claim, mounting the same claim. Nothing is copied to your machine: your local api reads and writes the volume itself. It writes a file: the write travels through the SSH tunnel to the plug agent, which relays it to the helper, which writes it on the volume. The loop ends with the helper removed and the service restored.</desc>
  <defs>
    <marker id="mt-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950" /></marker>
    <marker id="mt-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7" /></marker>
    <marker id="mt-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff" /></marker>
  </defs>
  <rect x="2" y="2" width="896" height="507" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- The cluster. -->
  <rect x="176" y="52" width="374" height="396" rx="12" fill="#0e141b" stroke="#30363d" />
  <text x="200" y="80" font-size="12" letter-spacing="2" fill="#8b949e" font-weight="700">THE CLUSTER</text>

  <!-- The storage, outside the cluster, and the claim on it: a permanent
       connector through the cluster's border, which is what a pod mounts. -->
  <text x="36" y="300" font-size="11" letter-spacing="1.5" fill="#8b949e" font-weight="700">STORAGE</text>
  <ellipse cx="95" cy="330" rx="58" ry="13" fill="#161b22" stroke="#30363d" />
  <path d="M37 330 V400 a58 13 0 0 0 116 0 V330" fill="#161b22" stroke="#30363d" />
  <ellipse cx="95" cy="330" rx="58" ry="13" fill="#161b22" stroke="#30363d" />
  <text x="95" y="372" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e6edf3" font-weight="600">data</text>
  <text x="95" y="434" text-anchor="middle" font-size="9" fill="#8b949e">a disk, NFS, a cloud volume</text>
  <line x1="153" y1="362" x2="212" y2="362" stroke="#8b949e" stroke-width="2.2" />
  <rect x="212" y="346" width="80" height="32" rx="5" fill="#21262d" stroke="#8b949e" stroke-width="1.4" />
  <text x="252" y="366" text-anchor="middle" font-size="9.5" fill="#e6edf3" font-weight="600">PVC or volume</text>

  <!-- The agent. -->
  <rect x="430" y="120" width="90" height="98" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.4" />
  <text x="475" y="156" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-weight="600">plug</text>
  <text x="475" y="173" text-anchor="middle" font-size="11" fill="#8b949e">agent</text>

  <!-- api as DEPLOYED (live before the session, restored at the end). -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.46;0.96;1" dur="16s" repeatCount="indefinite" />
    <rect x="200" y="130" width="148" height="54" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="274" y="153" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e6edf3" font-weight="600">api</text>
    <text x="274" y="170" text-anchor="middle" font-size="8.5" fill="#8b949e">deployed in the stack</text>
    <line x1="252" y1="184" x2="252" y2="346" stroke="#8b949e" stroke-width="1.8" />
    <text x="242" y="270" text-anchor="end" font-size="8.5" fill="#8b949e">mounts it</text>
  </g>
  <!-- api PARKED while the plug session lives. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.96;1" dur="16s" repeatCount="indefinite" />
    <g opacity="0.55">
      <rect x="200" y="130" width="148" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3" />
      <text x="274" y="153" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#8b949e" font-weight="600">api</text>
      <text x="274" y="170" text-anchor="middle" font-size="8.5" fill="#6e7681">deployed · restored on exit</text>
    </g>
    <rect x="302" y="123" width="42" height="14" rx="7" fill="#0d1117" stroke="#d29922" stroke-width="0.8" />
    <text x="323" y="133" text-anchor="middle" font-size="8.5" fill="#d29922">parked</text>
  </g>

  <!-- Round 1: the deployed api reads and writes through the claim. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.36;0.40;1" dur="16s" repeatCount="indefinite" />
    <rect x="200" y="130" width="148" height="54" rx="8" fill="none" stroke="#3fb950" stroke-width="2" />
    <line x1="252" y1="188" x2="252" y2="342" stroke="#3fb950" stroke-width="2.2" marker-start="url(#mt-g)" marker-end="url(#mt-g)" />
    <text x="262" y="270" font-size="9.5" fill="#3fb950" font-weight="600">reads and writes</text>
    <rect x="212" y="346" width="80" height="32" rx="5" fill="none" stroke="#3fb950" stroke-width="2" />
    <line x1="153" y1="362" x2="212" y2="362" stroke="#3fb950" stroke-width="2.6" />
  </g>

  <!-- The helper: pops beside the volume when the session starts, gone when it ends. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <rect x="354" y="336" width="186" height="52" rx="8" fill="#21262d" stroke="#a371f7" stroke-width="1.4" />
    <text x="447" y="359" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-weight="600">plug helper</text>
    <text x="447" y="375" text-anchor="middle" font-size="8.5" fill="#8b949e">started by the agent · removed on exit</text>
    <line x1="354" y1="362" x2="292" y2="362" stroke="#8b949e" stroke-width="1.8" />
    <text x="323" y="354" text-anchor="middle" font-size="8.5" fill="#8b949e">mounts it</text>
  </g>

  <!-- Your side: dimmed until the plug session starts. -->
  <g opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.42;0.46;0.96;1" dur="16s" repeatCount="indefinite" />
    <rect x="550" y="120" width="96" height="98" rx="6" fill="#0d1117" stroke="#21262d" stroke-dasharray="3 3" />
    <text x="598" y="114" text-anchor="middle" font-size="9" fill="#6e7681">SSH tunnel</text>
    <rect x="646" y="96" width="232" height="144" rx="12" fill="#161b22" stroke="#30363d" />
    <text x="662" y="118" font-size="11" letter-spacing="1.5" fill="#8b949e" font-weight="700">YOUR MACHINE</text>
    <rect x="662" y="128" width="200" height="60" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="762" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e6edf3" font-weight="600">api</text>
    <text x="762" y="172" text-anchor="middle" font-size="10" fill="#8b949e">npm run start:dev</text>
    <text x="762" y="208" text-anchor="middle" font-size="8.5" fill="#8b949e">its files are the real volume · nothing is copied</text>
    <text x="762" y="226" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6e7681">plug -s api:80:3000</text>
    <rect x="412" y="96" width="476" height="158" rx="16" fill="none" stroke="#a371f7" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.85" />
    <rect x="412" y="86" width="48" height="20" rx="5" fill="#0d1117" stroke="#a371f7" />
    <text x="436" y="100" text-anchor="middle" font-size="11" fill="#a371f7" font-weight="700">plug</text>
  </g>
  <!-- The plug command lights up right before the session block does. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.405;0.417;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <text x="762" y="226" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#3fb950" font-weight="600">plug -s api:80:3000</text>
  </g>

  <!-- Step 1: your local api writes a file. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.572;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <rect x="662" y="128" width="200" height="60" rx="8" fill="none" stroke="#3fb950" stroke-width="2" />
    <text x="654" y="146" text-anchor="end" font-size="9.5" fill="#3fb950" font-weight="600">writes report.csv</text>
  </g>
  <!-- Step 2: the write goes down the tunnel to the agent. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.632;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <line x1="660" y1="160" x2="524" y2="160" stroke="#a371f7" stroke-width="2.2" marker-end="url(#mt-p)" />
    <text x="598" y="178" text-anchor="middle" font-size="9.5" fill="#a371f7">SMB, in the tunnel</text>
    <rect x="430" y="120" width="90" height="98" rx="8" fill="none" stroke="#a371f7" stroke-width="2" />
  </g>
  <!-- Step 3: the agent relays to the helper. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.712;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <path d="M475 220 V332" fill="none" stroke="#a371f7" stroke-width="2.2" marker-end="url(#mt-p)" />
    <text x="485" y="292" font-size="9.5" fill="#a371f7">relayed to the helper</text>
    <rect x="354" y="336" width="186" height="52" rx="8" fill="none" stroke="#a371f7" stroke-width="2" />
  </g>
  <!-- Step 4: the helper writes through the claim, as the workload's user. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.772;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <line x1="352" y1="362" x2="298" y2="362" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#mt-b)" />
    <rect x="212" y="346" width="80" height="32" rx="5" fill="none" stroke="#58a6ff" stroke-width="2" />
    <line x1="153" y1="362" x2="212" y2="362" stroke="#58a6ff" stroke-width="2.6" />
    <ellipse cx="95" cy="330" rx="58" ry="13" fill="none" stroke="#58a6ff" stroke-width="2" />
    <path d="M37 330 V400 a58 13 0 0 0 116 0 V330" fill="none" stroke="#58a6ff" stroke-width="2" />
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80;0.812;0.90;0.94;1" dur="16s" repeatCount="indefinite" />
    <text x="95" y="394" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#58a6ff" font-weight="700">+ report.csv</text>
  </g>

  <line x1="60" y1="481" x2="90" y2="481" stroke="#3fb950" stroke-width="2.6" />
  <text x="98" y="485" font-size="11.5" fill="#8b949e">your process, reading and writing its files</text>
  <line x1="360" y1="481" x2="390" y2="481" stroke="#a371f7" stroke-width="2.6" />
  <text x="398" y="485" font-size="11.5" fill="#8b949e">relayed through plug</text>
  <line x1="560" y1="481" x2="590" y2="481" stroke="#58a6ff" stroke-width="2.6" />
  <text x="598" y="485" font-size="11.5" fill="#8b949e">written on the real volume</text>
</svg>
