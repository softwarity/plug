<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>Through Meerkat, everyone using the application is told what is substituted, and by whom</title>
  <desc>An illustration in two screens. At sign-in, the gateway names what is substituted and by whom before handing the application over: checkout, by Alice. Then, on every page of the application, a strip says it again, and updates live as substitutions start and stop.</desc>
  <defs>
    <marker id="mk-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7" /></marker>
  </defs>
  <rect x="2" y="2" width="896" height="326" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- At sign-in. -->
  <text x="160" y="40" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#8b949e" font-weight="700">AT SIGN-IN</text>
  <rect x="30" y="56" width="260" height="220" rx="10" fill="#161b22" stroke="#30363d" />
  <rect x="42" y="68" width="236" height="18" rx="4" fill="#21262d" />
  <text x="160" y="80.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#8b949e">shop.test.example.com</text>
  <text x="160" y="118" text-anchor="middle" font-size="12" fill="#e6edf3" font-weight="600">Substituted right now</text>
  <rect x="58" y="134" width="204" height="52" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="0.9" />
  <text x="160" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e6edf3" font-weight="600">checkout</text>
  <text x="160" y="174" text-anchor="middle" font-size="10.5" fill="#d29922">by Alice</text>
  <rect x="110" y="212" width="100" height="28" rx="6" fill="#a371f7" />
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#0d1117" font-weight="600">Continue</text>

  <path d="M298 166 H340" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#mk-p)" />

  <!-- On every page. -->
  <text x="608" y="40" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#8b949e" font-weight="700">ON EVERY PAGE</text>
  <rect x="348" y="56" width="520" height="220" rx="10" fill="#161b22" stroke="#30363d" />
  <rect x="360" y="68" width="496" height="18" rx="4" fill="#21262d" />
  <text x="608" y="80.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#8b949e">shop.test.example.com/cart</text>
  <rect x="360" y="92" width="496" height="24" rx="4" fill="#d29922" opacity="0.18" />
  <circle cx="374" cy="104" r="4" fill="#d29922" />
  <text x="386" y="108" font-size="10.5" fill="#e6edf3">checkout, by Alice</text>
  <text x="846" y="108" text-anchor="end" font-size="9" fill="#8b949e">live</text>
  <rect x="360" y="116" width="496" height="148" fill="#0d1117" stroke="#30363d" />
  <rect x="380" y="134" width="140" height="10" rx="5" fill="#30363d" />
  <rect x="380" y="156" width="300" height="8" rx="4" fill="#21262d" />
  <rect x="380" y="172" width="260" height="8" rx="4" fill="#21262d" />
  <rect x="380" y="188" width="280" height="8" rx="4" fill="#21262d" />
  <rect x="716" y="224" width="120" height="26" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="776" y="241" text-anchor="middle" font-size="10.5" fill="#c9d1d9">Pay</text>

  <text x="450" y="306" text-anchor="middle" font-size="11.5" fill="#c9d1d9">A tester who meets a bug knows which code answered: Alice's branch, not the deployed checkout.</text>
</svg>
